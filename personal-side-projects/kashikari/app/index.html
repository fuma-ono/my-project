<title>kashikari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff9f2;
    --surface: #ffffff;
    --surface-2: #fff3e8;
    --ink: #2b2420;
    --muted: #948572;
    --line: #f1e4d3;
    --accent: #ff6b4a;
    --accent-ink: #ffffff;
    --accent-soft: #ffe4da;
    --favor: #8c4fd1;
    --favor-soft: #ece0fb;
    --owed: #1fa37a;
    --owed-soft: #d9f3ea;
    --owe: #ff5470;
    --owe-soft: #ffe1e6;
    --brand2: #2d3a8c;
    --shadow-sm: 0 1px 2px rgba(60, 40, 20, 0.06);
    --shadow-md: 0 4px 14px rgba(60, 40, 20, 0.09), 0 1px 3px rgba(60, 40, 20, 0.06);
  }
  /* kashikariは常に明るいトーンで統一する(意図的にライトテーマ単一構成、ダークモード追従なし) */

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: clamp(16px, 5vw, 48px) 16px 96px;
  }
  .sheet { width: 100%; max-width: 560px; }

  /* header */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .mark {
    flex: none;
    width: 56px; height: 56px;
    border-radius: 17px;
    background: linear-gradient(155deg, var(--accent), var(--favor));
    color: #fff;
    display: grid; place-items: center;
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: 27px;
    box-shadow: var(--shadow-sm);
  }
  .wordmark {
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: clamp(34px, 8.5vw, 44px);
    letter-spacing: -0.01em;
  }
  .tagline { margin: 8px 0 18px; color: var(--muted); font-size: 14.5px; }

  /* who am I */
  .who-row { margin-bottom: 16px; }
  .who-pill {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 7px 14px 7px 8px;
    font-size: 13.5px; font-weight: 600; color: var(--ink);
    box-shadow: var(--shadow-sm);
  }
  .who-pill .avatar { width: 22px; height: 22px; font-size: 11px; box-shadow: none; }
  .who-pill .muted-label { color: var(--muted); font-weight: 500; }
  .who-panel {
    display: none; flex-wrap: wrap; gap: 6px;
    margin-top: 8px; padding: 10px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-sm);
  }
  .who-panel.open { display: flex; }
  .who-panel button {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px 6px 6px; border-radius: 999px; border: 1.5px solid var(--line);
    font-size: 13px; font-weight: 600;
  }
  .who-panel button:hover { border-color: var(--accent); }
  .who-panel button.clear { border-style: dashed; color: var(--muted); padding: 6px 12px; }

  .banner {
    background: var(--owe-soft);
    border: 1px solid color-mix(in srgb, var(--owe) 45%, transparent);
    color: var(--ink);
    border-radius: 12px;
    padding: 11px 15px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .banner.show { display: block; }

  /* member strip */
  .member-strip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 999px;
    display: grid; place-items: center;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    flex: none;
    font-family: "Work Sans", sans-serif;
    box-shadow: var(--shadow-sm);
  }
  .avatar.sm { width: 24px; height: 24px; font-size: 11.5px; box-shadow: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px 5px 5px;
    font-size: 13.5px;
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }
  .chip button {
    all: unset; cursor: pointer; color: var(--muted);
    width: 17px; height: 17px; display: grid; place-items: center;
    font-size: 11px; border-radius: 999px;
  }
  .chip button:hover { background: var(--surface-2); color: var(--ink); }
  .add-member-btn {
    all: unset; cursor: pointer;
    width: 34px; height: 34px; border-radius: 999px;
    border: 2px dashed color-mix(in srgb, var(--muted) 55%, transparent);
    color: var(--muted);
    display: grid; place-items: center; font-size: 17px;
    transition: transform 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .add-member-btn:hover { border-color: var(--accent); color: var(--accent); }
  .add-member-btn:active { transform: scale(0.92); }
  .member-input-row {
    display: flex; gap: 6px; align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 4px 4px 14px;
    box-shadow: var(--shadow-sm);
  }
  .member-input-row input { all: unset; font: inherit; font-size: 13.5px; width: 100px; }

  /* section titles */
  .section-title {
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 2px 12px;
  }

  button.primary {
    all: unset; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 14px;
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.1s ease, filter 0.1s ease;
  }
  button.primary:hover { filter: brightness(1.06); }
  button.primary:active { transform: scale(0.96); }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }

  /* balance cards */
  .balance-block { margin-bottom: 26px; }
  #balances { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  #balances li {
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  #balances li.mine { border: 1.5px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .bal-pair { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .bal-arrow { color: var(--muted); font-size: 15px; }
  .bal-name { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bal-name.me { color: var(--accent); }
  .bal-amount { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 19px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bal-amount.owe { color: var(--owe); }
  .bal-amount.owed { color: var(--favor); }
  .bal-settle {
    all: unset; cursor: pointer;
    font-size: 12.5px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 7px 12px;
    white-space: nowrap;
    transition: transform 0.1s ease;
  }
  .bal-settle:hover { filter: brightness(0.97); }
  .bal-settle:active { transform: scale(0.94); }
  .settled-all {
    color: var(--muted); font-size: 14.5px;
    background: var(--surface);
    border-radius: 16px;
    padding: 22px 16px;
    text-align: center;
    box-shadow: var(--shadow-sm);
  }

  /* ledger card */
  .card {
    background: var(--surface);
    border-radius: 18px;
    box-shadow: var(--shadow-md);
    padding: 18px 18px 20px;
    margin-bottom: 16px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .card-head .section-title { margin-bottom: 0; }

  /* floating add button */
  .fab {
    all: unset; cursor: pointer;
    position: fixed; right: 20px; bottom: 20px; z-index: 10;
    width: 60px; height: 60px; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: "Fredoka", sans-serif; font-size: 30px; font-weight: 600;
    box-shadow: 0 6px 20px rgba(255, 107, 74, 0.4), var(--shadow-md);
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .fab:hover { filter: brightness(1.05); }
  .fab:active { transform: scale(0.93); }
  .fab:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: var(--shadow-sm); }
  .fab[hidden] { display: none; }

  /* add entry (collapsible) */
  .entry-form { display: flex; flex-direction: column; gap: 11px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .entry-form[hidden] { display: none; }
  .entry-form .row { display: flex; gap: 8px; align-items: center; }
  .entry-form select { flex: 1; min-width: 0; }
  .arrow { color: var(--muted); }
  input[type="text"], input[type="number"], select {
    font: inherit; color: var(--ink); background: var(--surface-2);
    border: 1.5px solid transparent; border-radius: 10px;
    padding: 10px 12px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .type-toggle { display: flex; gap: 8px; }
  .type-toggle button {
    all: unset; cursor: pointer; flex: 1; text-align: center;
    padding: 10px; border-radius: 12px; border: 1.5px solid var(--line);
    font-size: 14.5px; font-weight: 600; color: var(--muted);
    transition: transform 0.1s ease;
  }
  .type-toggle button:active { transform: scale(0.97); }
  .type-toggle button[data-type="money"][aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .type-toggle button[data-type="favor"][aria-pressed="true"] { border-color: var(--favor); color: var(--favor); background: var(--favor-soft); }
  .amount-row { display: flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 10px; padding: 0 4px; }
  .amount-row input[type="number"] { width: 100%; background: transparent; border: none; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 16px; }
  .amount-row select {
    background: transparent; border: none; font-family: "Fredoka", sans-serif;
    font-weight: 600; color: var(--muted); padding: 10px 4px 10px 10px;
  }
  .entry-form-actions { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  button.ghost { all: unset; cursor: pointer; color: var(--muted); font-size: 13.5px; font-weight: 600; padding: 9px 12px; }
  button.ghost:hover { color: var(--ink); }

  .photo-attach { display: flex; align-items: center; gap: 10px; }
  .photo-btn {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 600; color: var(--favor);
    background: var(--favor-soft); border-radius: 999px; padding: 8px 14px;
  }
  .photo-btn:hover { filter: brightness(0.97); }
  .photo-preview { position: relative; display: none; }
  .photo-preview.show { display: block; }
  .photo-preview img { width: 52px; height: 52px; object-fit: cover; border-radius: 10px; box-shadow: var(--shadow-sm); }
  .photo-preview button {
    all: unset; cursor: pointer; position: absolute; top: -6px; right: -6px;
    width: 20px; height: 20px; border-radius: 999px; background: var(--ink); color: var(--bg);
    display: grid; place-items: center; font-size: 11px;
  }

  /* ledger rows */
  #entries { list-style: none; margin: 4px 0 0; padding: 0; }
  #entries li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
  #entries li:first-child { border-top: none; padding-top: 2px; }
  .type-badge {
    width: 38px; height: 38px; border-radius: 12px;
    display: grid; place-items: center; font-size: 17px; flex: none;
  }
  .type-badge.money { background: var(--accent-soft); }
  .type-badge.favor { background: var(--favor-soft); }
  .entry-main { min-width: 0; }
  .entry-who { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .entry-desc { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .entry-date { font-size: 11.5px; color: var(--muted); }
  .entry-amount { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 16px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #entries li[data-settled="true"] { opacity: 0.42; }
  #entries li[data-settled="true"] .entry-who, #entries li[data-settled="true"] .entry-amount { text-decoration: line-through; }
  .row-menu-wrap { position: relative; display: flex; align-items: center; gap: 6px; }
  .row-menu-btn { all: unset; cursor: pointer; color: var(--muted); width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; font-size: 16px; }
  .row-menu-btn:hover { background: var(--surface-2); color: var(--ink); }
  .row-menu {
    position: absolute; right: 0; top: 32px; z-index: 2;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow-md); padding: 5px; display: none; min-width: 140px;
  }
  .row-menu.open { display: block; }
  .row-menu button { all: unset; cursor: pointer; display: block; width: 100%; text-align: left; font-size: 13.5px; font-weight: 500; padding: 8px 10px; border-radius: 8px; }
  .row-menu button:hover { background: var(--surface-2); }
  .empty-note { color: var(--muted); font-size: 14.5px; text-align: center; padding: 18px 4px 6px; }

  .entry-photo {
    width: 40px; height: 40px; border-radius: 10px; object-fit: cover;
    cursor: pointer; box-shadow: var(--shadow-sm); flex: none;
  }
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 20;
    background: rgba(20, 15, 10, 0.82);
    align-items: center; justify-content: center; padding: 24px;
    cursor: pointer;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4); }

  .footer-note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; line-height: 1.6; }

  @media (prefers-reduced-motion: no-preference) {
    #entries li.entering { animation: entering 0.32s ease both; }
    @keyframes entering { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .entry-form { animation: unfold 0.22s ease both; }
    @keyframes unfold { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .chip { animation: pop 0.22s ease both; }
    @keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  }
</style>

<div class="sheet">
  <div class="topbar">
    <span class="mark" aria-hidden="true">⇄</span>
    <span class="wordmark">kashikari</span>
  </div>
  <p class="tagline">友達との貸し借りを、お金も頼みごとも一緒に記録する</p>

  <div class="banner" id="readonlyBanner">この端末では編集できません。閲覧のみです。</div>

  <div class="who-row" artifact-local>
    <button type="button" class="who-pill" id="whoAmIBtn">
      <span class="muted-label">あなたは:</span> <span id="whoAmILabel">未設定</span>
    </button>
    <div class="who-panel" id="whoPanel"></div>
  </div>

  <div class="member-strip" id="memberStrip" artifact-sync></div>
  <div class="member-strip" artifact-local>
    <div class="member-input-row" id="memberInputRow" hidden>
      <input type="text" id="memberInput" placeholder="名前" maxlength="20">
      <button class="primary" id="confirmMemberBtn">追加</button>
    </div>
    <button class="add-member-btn" id="addMemberBtn" aria-label="メンバーを追加" title="メンバーを追加">＋</button>
  </div>

  <div class="balance-block">
    <p class="section-title">いまの貸し借り</p>
    <ul id="balances" artifact-local></ul>
    <p class="settled-all" id="balancesEmpty">🎉 今のところ貸し借りはすべて精算済みです</p>
  </div>

  <div class="card">
    <div class="card-head">
      <p class="section-title">台帳</p>
    </div>
    <ul id="entries" artifact-sync></ul>
    <p class="empty-note" id="entriesEmpty">まだ記録がありません。右下の「＋」から最初の貸し借りを記録しましょう。</p>

    <div class="entry-form" id="entryForm" artifact-local hidden>
      <div class="row">
        <select id="fromSelect" aria-label="貸した人"></select>
        <span class="arrow">→</span>
        <select id="toSelect" aria-label="借りた人"></select>
      </div>
      <div class="type-toggle" role="group" aria-label="種類">
        <button type="button" id="typeMoney" data-type="money" aria-pressed="true">💰 お金</button>
        <button type="button" id="typeFavor" data-type="favor" aria-pressed="false">🤝 頼みごと</button>
      </div>
      <div class="amount-row" id="amountRow">
        <select id="currencySelect" aria-label="通貨"></select>
        <input type="number" id="amountInput" placeholder="金額" min="0" step="0.01" inputmode="decimal">
      </div>
      <input type="text" id="descInput" placeholder="内容(例: ラーメン奢った / 引っ越し手伝った)" maxlength="60">

      <div class="photo-attach">
        <button type="button" class="photo-btn" id="photoAttachBtn">📷 レシートを撮る/添付</button>
        <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
        <div class="photo-preview" id="photoPreview">
          <img id="photoPreviewImg" alt="添付したレシート">
          <button type="button" id="photoRemoveBtn" aria-label="写真を削除">✕</button>
        </div>
      </div>

      <div class="entry-form-actions">
        <button class="ghost" id="cancelAddBtn" type="button">キャンセル</button>
        <button class="primary" id="addEntryBtn" type="button">記録する</button>
      </div>
    </div>
  </div>

  <p class="footer-note">全員が同じページを見ています。誰かが記録すると、みんなの画面に反映されます。<br>金額の貸し借りは自動で相殺され、頼みごとは1件ずつ残ります。</p>
</div>

<button type="button" class="fab" id="openAddBtn" aria-label="貸し借りを記録" title="貸し借りを記録">＋</button>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" alt="レシート拡大表示">
</div>

<script>
(function () {
  "use strict";

  var memberStrip = document.getElementById("memberStrip");
  var entriesList = document.getElementById("entries");
  var entriesEmpty = document.getElementById("entriesEmpty");
  var balancesList = document.getElementById("balances");
  var balancesEmpty = document.getElementById("balancesEmpty");
  var fromSelect = document.getElementById("fromSelect");
  var toSelect = document.getElementById("toSelect");
  var readonlyBanner = document.getElementById("readonlyBanner");
  var entryForm = document.getElementById("entryForm");
  var openAddBtn = document.getElementById("openAddBtn");

  var currentType = "money";
  var AVATAR_PALETTE = ["#ff6b4a", "#1fa37a", "#2d3a8c", "#e0a73c", "#8c4fd1", "#2aa7c4", "#4b8b3b", "#e0527a"];
  var CURRENCIES = [
    { code: "JPY", label: "¥ JPY" },
    { code: "USD", label: "$ USD" },
    { code: "EUR", label: "€ EUR" },
    { code: "GBP", label: "£ GBP" },
    { code: "KRW", label: "₩ KRW" },
    { code: "CNY", label: "¥ CNY" },
    { code: "TWD", label: "NT$ TWD" },
    { code: "THB", label: "฿ THB" },
    { code: "AUD", label: "A$ AUD" }
  ];
  var LAST_CURRENCY_KEY = "kashikari_last_currency";

  function formatMoney(amount, code) {
    code = code || "JPY";
    var formatted;
    try {
      formatted = new Intl.NumberFormat(undefined, { style: "currency", currency: code }).format(amount);
    } catch (e) {
      formatted = "¥" + Number(amount).toLocaleString("ja-JP");
    }
    return code === "JPY" ? formatted : formatted + " " + code;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function genKey() {
    return "k" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function avatarColor(name) {
    var hash = 0;
    for (var i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_PALETTE[Math.abs(hash) % AVATAR_PALETTE.length];
  }
  function avatarHtml(name, size) {
    var initial = Array.from(name || "?")[0] || "?";
    return '<span class="avatar' + (size === "sm" ? " sm" : "") + '" style="background:' + avatarColor(name) + '">' + esc(initial) + "</span>";
  }
  function formatDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var now = new Date();
    var sameYear = d.getFullYear() === now.getFullYear();
    return sameYear ? (d.getMonth() + 1) + "/" + d.getDate() : d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate();
  }
  function renderEntryDates() {
    entriesList.querySelectorAll("li[data-ts]").forEach(function (li) {
      var span = li.querySelector(".entry-date");
      if (!span) return;
      var hasDesc = !!(li.dataset.desc && li.dataset.desc.trim());
      span.textContent = (hasDesc ? "・" : "") + formatDate(li.dataset.ts);
    });
  }

  // ---------- who am I (per-device, local only) ----------

  var ME_KEY = "kashikari_me";
  function getMe() {
    try { return localStorage.getItem(ME_KEY) || ""; } catch (e) { return ""; }
  }
  function setMe(name) {
    try {
      if (name) localStorage.setItem(ME_KEY, name); else localStorage.removeItem(ME_KEY);
    } catch (e) { /* storage unavailable, ignore */ }
    renderWhoAmI();
    renderBalances();
  }
  var whoAmILabel = document.getElementById("whoAmILabel");
  var whoPanel = document.getElementById("whoPanel");
  function renderWhoAmI() {
    var me = getMe();
    var names = memberNames();
    whoAmILabel.textContent = (me && names.indexOf(me) !== -1) ? me : "未設定";
    whoPanel.innerHTML = names.map(function (n) {
      return '<button type="button" data-me="' + esc(n) + '">' + avatarHtml(n, "sm") + esc(n) + "</button>";
    }).join("") + '<button type="button" class="clear" data-me="">設定しない</button>';
  }
  document.getElementById("whoAmIBtn").addEventListener("click", function () {
    whoPanel.classList.toggle("open");
  });
  whoPanel.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-me]");
    if (!btn) return;
    setMe(btn.dataset.me);
    whoPanel.classList.remove("open");
  });

  // ---------- members ----------

  function memberNames() {
    return Array.from(memberStrip.querySelectorAll("[data-name]")).map(function (el) { return el.dataset.name; });
  }

  function renderSelects() {
    var names = memberNames();
    [fromSelect, toSelect].forEach(function (sel) {
      var prev = sel.value;
      sel.innerHTML = names.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + "</option>"; }).join("");
      if (names.indexOf(prev) !== -1) sel.value = prev;
    });
    if (names.length >= 2 && fromSelect.value === toSelect.value) {
      toSelect.selectedIndex = toSelect.selectedIndex === 0 ? 1 : 0;
    }
    openAddBtn.disabled = names.length < 2;
    openAddBtn.title = names.length < 2 ? "先にメンバーを2人以上追加してください" : "";
    renderWhoAmI();
  }

  function addMember(name) {
    name = name.trim();
    if (!name || memberNames().indexOf(name) !== -1) return;
    var chip = document.createElement("span");
    chip.className = "chip";
    chip.dataset.name = name;
    chip.dataset.key = genKey();
    chip.innerHTML = avatarHtml(name, "sm") + esc(name) + ' <button type="button" aria-label="' + esc(name) + 'を削除">✕</button>';
    memberStrip.appendChild(chip);
    renderSelects();
  }

  var addMemberBtn = document.getElementById("addMemberBtn");
  var memberInputRow = document.getElementById("memberInputRow");
  var memberInput = document.getElementById("memberInput");

  addMemberBtn.addEventListener("click", function () {
    memberInputRow.hidden = false;
    addMemberBtn.hidden = true;
    memberInput.focus();
  });
  function closeMemberInput() {
    memberInputRow.hidden = true;
    addMemberBtn.hidden = false;
    memberInput.value = "";
  }
  document.getElementById("confirmMemberBtn").addEventListener("click", function () {
    addMember(memberInput.value);
    closeMemberInput();
  });
  memberInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { addMember(memberInput.value); closeMemberInput(); }
    if (e.key === "Escape") closeMemberInput();
  });

  memberStrip.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var chip = btn.closest("[data-name]");
    var name = chip.dataset.name;
    var inUse = entriesList.querySelector('li[data-from="' + CSS.escape(name) + '"], li[data-to="' + CSS.escape(name) + '"]');
    if (inUse && !confirm(name + "さんは台帳に記録があります。メンバーからは削除しますが、過去の記録は残ります。よろしいですか?")) return;
    chip.remove();
    renderSelects();
  });

  // ---------- add-entry panel ----------

  openAddBtn.addEventListener("click", function () {
    entryForm.hidden = false;
    openAddBtn.hidden = true;
    entryForm.scrollIntoView({ behavior: "smooth", block: "center" });
    document.getElementById("descInput").focus();
  });
  function closeEntryForm() {
    entryForm.hidden = true;
    openAddBtn.hidden = false;
    document.getElementById("amountInput").value = "";
    document.getElementById("descInput").value = "";
    clearPendingPhoto();
  }
  document.getElementById("cancelAddBtn").addEventListener("click", closeEntryForm);

  // ---------- photo attach (compressed, embedded thumbnail) ----------

  var pendingPhoto = null;
  var photoInput = document.getElementById("photoInput");
  var photoPreview = document.getElementById("photoPreview");
  var photoPreviewImg = document.getElementById("photoPreviewImg");

  document.getElementById("photoAttachBtn").addEventListener("click", function () {
    photoInput.click();
  });

  function clearPendingPhoto() {
    pendingPhoto = null;
    photoPreview.classList.remove("show");
    photoPreviewImg.src = "";
    photoInput.value = "";
  }
  document.getElementById("photoRemoveBtn").addEventListener("click", clearPendingPhoto);

  photoInput.addEventListener("change", function () {
    var file = photoInput.files && photoInput.files[0];
    if (!file) return;
    var img = new Image();
    var reader = new FileReader();
    reader.onload = function () {
      img.onload = function () {
        var maxDim = 720;
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        pendingPhoto = canvas.toDataURL("image/jpeg", 0.55);
        photoPreviewImg.src = pendingPhoto;
        photoPreview.classList.add("show");
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  // ---------- lightbox ----------

  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightboxImg");
  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add("open");
  }
  lightbox.addEventListener("click", function () { lightbox.classList.remove("open"); });

  var typeMoneyBtn = document.getElementById("typeMoney");
  var typeFavorBtn = document.getElementById("typeFavor");
  var amountRow = document.getElementById("amountRow");
  function setType(type) {
    currentType = type;
    typeMoneyBtn.setAttribute("aria-pressed", String(type === "money"));
    typeFavorBtn.setAttribute("aria-pressed", String(type === "favor"));
    amountRow.style.display = type === "money" ? "flex" : "none";
  }
  typeMoneyBtn.addEventListener("click", function () { setType("money"); });
  typeFavorBtn.addEventListener("click", function () { setType("favor"); });
  setType("money");

  var currencySelect = document.getElementById("currencySelect");
  currencySelect.innerHTML = CURRENCIES.map(function (c) {
    return '<option value="' + c.code + '">' + c.label + "</option>";
  }).join("");
  (function () {
    var saved;
    try { saved = localStorage.getItem(LAST_CURRENCY_KEY); } catch (e) { saved = null; }
    if (saved && CURRENCIES.some(function (c) { return c.code === saved; })) currencySelect.value = saved;
  })();
  currencySelect.addEventListener("change", function () {
    try { localStorage.setItem(LAST_CURRENCY_KEY, currencySelect.value); } catch (e) { /* ignore */ }
  });

  // ---------- entries ----------

  function entryLi(entry) {
    var li = document.createElement("li");
    li.dataset.key = entry.key;
    li.dataset.from = entry.from;
    li.dataset.to = entry.to;
    li.dataset.type = entry.type;
    li.dataset.amount = entry.amount || "";
    li.dataset.currency = entry.currency || "JPY";
    li.dataset.desc = entry.desc;
    li.dataset.settled = entry.settled ? "true" : "false";
    li.dataset.ts = entry.ts || new Date().toISOString();

    var badgeHtml = entry.type === "money"
      ? '<span class="type-badge money" aria-hidden="true">💰</span>'
      : '<span class="type-badge favor" aria-hidden="true">🤝</span>';
    var amountHtml = entry.type === "money"
      ? '<div class="entry-amount">' + esc(formatMoney(entry.amount, entry.currency)) + "</div>"
      : '<div class="entry-amount">1件</div>';
    var photoHtml = entry.photo ? '<img class="entry-photo" src="' + esc(entry.photo) + '" alt="レシート">' : "";

    li.innerHTML =
      badgeHtml +
      '<div class="entry-main">' +
        '<div class="entry-who">' + esc(entry.from) + ' <span class="arrow">→</span> ' + esc(entry.to) + "</div>" +
        '<div class="entry-desc">' + (entry.desc ? esc(entry.desc) : "") + '<span class="entry-date" artifact-local></span></div>' +
      "</div>" +
      '<div class="row-menu-wrap">' +
        photoHtml +
        amountHtml +
        '<button type="button" class="row-menu-btn" aria-haspopup="true" aria-label="操作">⋯</button>' +
        '<div class="row-menu">' +
          '<button type="button" data-action="settle">' + (entry.settled ? "未精算に戻す" : "精算済みにする") + "</button>" +
          '<button type="button" data-action="delete">削除</button>' +
        "</div>" +
      "</div>";
    return li;
  }

  function addEntry(entry) {
    var li = entryLi(entry);
    entriesList.prepend(li);
    li.classList.add("entering");
    refreshEntriesEmpty();
    renderEntryDates();
    renderBalances();
  }

  document.getElementById("addEntryBtn").addEventListener("click", function () {
    var from = fromSelect.value, to = toSelect.value;
    var desc = document.getElementById("descInput").value.trim();
    var amountInput = document.getElementById("amountInput");

    if (!from || !to || from === to) { alert("貸した人と借りた人は別のメンバーを選んでください。"); return; }
    if (currentType === "money") {
      var amount = Number(amountInput.value);
      if (!amount || amount <= 0) { alert("金額を入力してください。"); return; }
      addEntry({ key: genKey(), from: from, to: to, type: "money", amount: amount, currency: currencySelect.value, desc: desc, settled: false, photo: pendingPhoto });
    } else {
      if (!desc) { alert("頼みごとの内容を入力してください(例: 引っ越し手伝った)。"); return; }
      addEntry({ key: genKey(), from: from, to: to, type: "favor", amount: "", desc: desc, settled: false, photo: pendingPhoto });
    }
    closeEntryForm();
  });

  entriesList.addEventListener("click", function (e) {
    var photoImg = e.target.closest(".entry-photo");
    if (photoImg) { openLightbox(photoImg.src); return; }
    var menuBtn = e.target.closest(".row-menu-btn");
    if (menuBtn) {
      var menu = menuBtn.nextElementSibling;
      var wasOpen = menu.classList.contains("open");
      document.querySelectorAll(".row-menu.open").forEach(function (m) { m.classList.remove("open"); });
      if (!wasOpen) menu.classList.add("open");
      return;
    }
    var actionBtn = e.target.closest("button[data-action]");
    if (!actionBtn) return;
    var li = actionBtn.closest("li");
    if (actionBtn.dataset.action === "settle") {
      var next = li.dataset.settled !== "true";
      li.dataset.settled = String(next);
      actionBtn.textContent = next ? "未精算に戻す" : "精算済みにする";
    } else if (actionBtn.dataset.action === "delete") {
      if (confirm("この記録を削除しますか?")) li.remove();
    }
    document.querySelectorAll(".row-menu.open").forEach(function (m) { m.classList.remove("open"); });
    refreshEntriesEmpty();
    renderBalances();
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".row-menu-wrap")) {
      document.querySelectorAll(".row-menu.open").forEach(function (m) { m.classList.remove("open"); });
    }
  });

  function refreshEntriesEmpty() {
    entriesEmpty.style.display = entriesList.children.length ? "none" : "block";
  }

  // ---------- balances (computed, local render) ----------

  function readOpenEntries() {
    return Array.from(entriesList.querySelectorAll("li[data-key]")).map(function (li) {
      return {
        from: li.dataset.from, to: li.dataset.to, type: li.dataset.type,
        amount: Number(li.dataset.amount) || 0, currency: li.dataset.currency || "JPY",
        settled: li.dataset.settled === "true"
      };
    }).filter(function (e) { return !e.settled; });
  }

  function settlePair(type, a, b, currency) {
    entriesList.querySelectorAll("li[data-key]").forEach(function (li) {
      if (li.dataset.settled === "true") return;
      if (type === "money" && li.dataset.type === "money" && (li.dataset.currency || "JPY") === currency &&
          ((li.dataset.from === a && li.dataset.to === b) || (li.dataset.from === b && li.dataset.to === a))) {
        li.dataset.settled = "true";
      }
      if (type === "favor" && li.dataset.type === "favor" && li.dataset.from === a && li.dataset.to === b) {
        li.dataset.settled = "true";
      }
    });
    refreshEntriesEmpty();
    renderBalances();
  }

  function renderBalances() {
    var open = readOpenEntries();
    var me = getMe();
    var money = {}, favorCount = {};

    open.forEach(function (e) {
      if (e.type === "money") {
        var pairKey = [e.from, e.to].sort().join("|") + "|" + e.currency;
        if (!money[pairKey]) money[pairKey] = { a: e.from, b: e.to, net: 0, currency: e.currency };
        var m = money[pairKey];
        m.net += (e.from === m.a) ? e.amount : -e.amount;
      } else {
        var fk = e.from + "→" + e.to;
        favorCount[fk] = (favorCount[fk] || 0) + 1;
      }
    });

    var rows = [];
    Object.keys(money).forEach(function (k) {
      var m = money[k];
      if (Math.abs(m.net) < 0.005) return;
      var creditor = m.net > 0 ? m.a : m.b;
      var debtor = m.net > 0 ? m.b : m.a;
      rows.push({ debtor: debtor, creditor: creditor, amount: formatMoney(Math.abs(m.net), m.currency), currency: m.currency, cls: "owe", type: "money" });
    });
    Object.keys(favorCount).forEach(function (k) {
      var parts = k.split("→");
      rows.push({ debtor: parts[0], creditor: parts[1], amount: favorCount[k] + "件", cls: "owed", type: "favor" });
    });

    rows.forEach(function (r) { r.mine = !!me && (r.debtor === me || r.creditor === me); });
    rows.sort(function (a, b) { return (b.mine === a.mine) ? 0 : (b.mine ? 1 : -1); });

    balancesList.innerHTML = rows.map(function (r) {
      var debtorLabel = r.mine && r.debtor === me ? "あなた" : r.debtor;
      var creditorLabel = r.mine && r.creditor === me ? "あなた" : r.creditor;
      return '<li class="' + (r.mine ? "mine" : "") + '">' +
        '<div class="bal-pair">' + avatarHtml(r.debtor, "sm") +
          '<span class="bal-name' + (r.mine && r.debtor === me ? " me" : "") + '">' + esc(debtorLabel) + '</span>' +
          '<span class="bal-arrow">→</span>' +
          avatarHtml(r.creditor, "sm") +
          '<span class="bal-name' + (r.mine && r.creditor === me ? " me" : "") + '">' + esc(creditorLabel) + '</span>' +
        '</div>' +
        '<span class="bal-amount ' + r.cls + '">' + esc(r.amount) + '</span>' +
        '<button type="button" class="bal-settle" data-type="' + r.type + '" data-a="' + esc(r.debtor) + '" data-b="' + esc(r.creditor) + '" data-currency="' + esc(r.currency || "") + '">精算する</button>' +
      "</li>";
    }).join("");
    balancesEmpty.style.display = rows.length ? "none" : "block";
    balancesList.style.display = rows.length ? "flex" : "none";
  }

  balancesList.addEventListener("click", function (e) {
    var btn = e.target.closest(".bal-settle");
    if (!btn) return;
    settlePair(btn.dataset.type, btn.dataset.a, btn.dataset.b, btn.dataset.currency);
  });

  // ---------- init & sync from other viewers ----------

  function fullRefresh() {
    renderSelects();
    refreshEntriesEmpty();
    renderEntryDates();
    renderWhoAmI();
    renderBalances();
  }

  document.addEventListener("claude:edit", fullRefresh);
  document.addEventListener("claude:sync-off", function () {
    readonlyBanner.classList.add("show");
    document.querySelectorAll("button, input, select").forEach(function (el) {
      if (!el.closest("#readonlyBanner")) el.disabled = true;
    });
  });

  (async function checkCapability() {
    try {
      var cap = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("artifact") : null;
      if (!cap) {
        readonlyBanner.textContent = "この環境ではリアルタイム保存が利用できません。変更はこの画面だけに残ります。";
        readonlyBanner.classList.add("show");
      }
    } catch (err) { /* never block rendering */ }
  })();

  fullRefresh();
})();
</script>
