# ECB の週間予定の2週間観測(HQ指示 2026-10-28「ECB週間予定の2週間観測を GitHub Actions へ移行」)。
# 社内PCには置かない。公開のページを読むだけ(DB・API・Secrets は使わない)。予定の部分だけを保存し、連絡先は消す。
# 記録はブランチ ecb-weekly-snapshots(このワークフローだけが書く。リポジトリは公開なので誰でも読める)。
# 停止: 最初の実行から14日を過ぎると、スクリプトは何も取得せず expired=true を返し、このワークフローを自分で無効にする
#       (gh workflow disable)。14日を過ぎて自動で続けることはない。消すときはこのファイルとスクリプトを main から消す。
name: FX ECB weekly snapshot

on:
  schedule:
    - cron: '30 0,8 * * *' # 09:30 / 17:30 JST(GitHub の混雑で遅れることがある)
  workflow_dispatch:
  push:
    # main に入れたとき(このファイルかスクリプトが変わったとき)に1回動かす(初回の実行)
    branches: [main]
    paths:
      - .github/workflows/fx-ecb-weekly-snapshot.yml
      - .github/scripts/fx_ecb_weekly_snapshot.py

permissions:
  contents: write # 記録のブランチへの書き込み
  actions: write # 14日後に自分を無効にする

concurrency:
  group: fx-ecb-weekly-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository == 'fuma-ono/my-project'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: code

      - name: Check out the record branch (created empty on the first run)
        working-directory: code
        run: |
          if git fetch --depth 1 origin ecb-weekly-snapshots; then
            git worktree add -B ecb-weekly-snapshots ../data FETCH_HEAD
          else
            git worktree add --orphan -b ecb-weekly-snapshots ../data
          fi

      - name: Fetch and record
        id: snapshot
        run: python3 code/.github/scripts/fx_ecb_weekly_snapshot.py data

      - name: Commit the record
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to record"
            exit 0
          fi
          git commit -q -m "ECB weekly snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin ecb-weekly-snapshots

      - name: Stop after the 14 days (disable this workflow)
        if: steps.snapshot.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}"
