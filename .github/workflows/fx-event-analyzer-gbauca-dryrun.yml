# 英国・豪州・カナダの取り込みの dry-run(HQ指示 2026-11-13「GB/AU/CA の dry-run を実装し、DEV へは書かない」)。
# - 動くのは、ブランチ verify/fx-gbauca-dryrun への push と、手動の実行だけ(定期実行なし)。
# - 実行するのは dry-run の2つだけ(ingest:gb-au-ca-schedules -- --dry-run、ingest:official-values -- --dry-run)。本番の形は動かさない
#   (テストで確かめる)。DB には書かない(ingestion_logs にも書かない)。値の dry-run は公式の API(ONS・ABS・StatCan)を読む。
# - 接続先が DEV でなければ止まる。出力は件数・plan・エラーだけ(鍵は出さない)。
name: FX Event Analyzer - GB/AU/CA dry run (DEV)

on:
  push:
    branches:
      - 'verify/fx-gbauca-dryrun'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fx-ingestion
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fx-event-analyzer-backend
    env:
      DEV_PROJECT_REF: pbemckwnqmeaoveelihd
      DEV_PROJECT_URL: https://pbemckwnqmeaoveelihd.supabase.co
      SUPABASE_URL: ${{ secrets.FX_DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FX_DEV_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check secrets and target (DEV only)
        id: check
        working-directory: .
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Secrets が未登録のため何もしません"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${SUPABASE_URL%/}" != "$DEV_PROJECT_URL" ]; then
            echo "接続先が社内確認用のDBではありません。止めます"
            exit 1
          fi
          KEY_REF=$(python3 -c 'import os,base64,json; p=os.environ["SUPABASE_SERVICE_ROLE_KEY"].split("."); print(json.loads(base64.urlsafe_b64decode(p[1]+"="*(-len(p[1])%4))).get("ref","") if len(p)==3 else "")' 2>/dev/null || true)
          if [ "$KEY_REF" != "$DEV_PROJECT_REF" ]; then
            echo "鍵が社内確認用のプロジェクトのものではありません。止めます"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fx-event-analyzer-backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        if: steps.check.outputs.ready == 'true'
      - name: GB/AU/CA schedules dry run
        if: steps.check.outputs.ready == 'true'
        run: |
          set +e
          npm run -s ingest:gb-au-ca-schedules -- --dry-run > "$RUNNER_TEMP/sched.json" 2> "$RUNNER_TEMP/sched.err"
          echo "exit=$?" > "$RUNNER_TEMP/sched.exit"
          python3 ../.github/scripts/annotate_dryrun.py sched
      - name: GB/AU/CA official values dry run
        if: ${{ !cancelled() && steps.check.outputs.ready == 'true' }}
        run: |
          set +e
          npm run -s ingest:official-values -- --dry-run > "$RUNNER_TEMP/values.json" 2> "$RUNNER_TEMP/values.err"
          echo "exit=$?" > "$RUNNER_TEMP/values.exit"
          python3 ../.github/scripts/annotate_dryrun.py values
