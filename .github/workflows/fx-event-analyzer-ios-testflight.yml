name: FX Event Analyzer iOS TestFlight (manual, signed)

# FX Event AnalyzerをApp Store Connect経由でTestFlightへアップロードする
# 専用ワークフロー。HQ指示(2026-10-19「FX Event AnalyzerのTestFlight配布
# 準備」)により追加。
#
# workflow_dispatchのみで起動する。pushやPRでは動かない。既存の
# fx-event-analyzer-ios-build.yml(Simulatorビルド+テスト、署名なし)には
# 一切手を加えていない。両者は完全に独立したワークフローで、Secretsも
# 共有しない。
#
# 認証はApp Store Connect APIキー(.p8)のみ。Apple ID/パスワードは使わない。
#
# 必須のRepository secrets(すべてFX_接頭辞。既存のkashikari用
# (ASC_KEY_ID等)・Supabase用(FX_SUPABASE_URL等)Secretsとは独立した別名):
#   FX_IOS_DIST_CERT_P12_BASE64         配布証明書+秘密鍵(.p12、base64)
#   FX_IOS_DIST_CERT_PASSWORD           上記.p12のパスフレーズ
#   FX_IOS_PROVISIONING_PROFILE_BASE64  App Store用プロビジョニングプロファイル(base64)
#   FX_IOS_PROVISIONING_PROFILE_NAME    上記プロファイルの正確なName
#   FX_IOS_BUILD_KEYCHAIN_PASSWORD      CI内に作る一時キーチェーンの任意パスフレーズ
#   FX_APPLE_TEAM_ID                    Apple Developer Team ID
#   FX_ASC_KEY_ID                       App Store Connect APIキーのKey ID
#   FX_ASC_ISSUER_ID                    同Issuer ID
#   FX_ASC_KEY_P8_BASE64                 同APIキーの.p8内容(base64化。以前はPEM形式そのまま
#                                        渡していたが"invalid curve name"エラーが続いたため変更)
#
# ビルド番号はCURRENT_PROJECT_VERSIONをgithub.run_numberで上書きする
# (project.yml自体は変更しない。既存のSimulatorビルドに影響なし)。
#
# ExportOptions.plistはコミットせず、このワークフロー内でSecretsの値から
# 都度生成する(Team ID・プロファイル名をリポジトリに平置きしない)。

on:
  workflow_dispatch: {}

jobs:
  testflight:
    runs-on: macos-15
    defaults:
      run:
        working-directory: fx-event-analyzer
    steps:
      - uses: actions/checkout@v4
        with:
          # ワークフロー定義自体はworkflow_dispatchの登録要件のためmainに置くが、
          # 実際のiOSアプリ本体・fastlane/Fastfileはclaude/fx-settings-screens
          # にあるため、そちらを明示的にcheckoutする。
          ref: claude/fx-settings-screens

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Cache Swift Package Manager artifacts
        uses: actions/cache@v4
        with:
          path: fx-event-analyzer/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('fx-event-analyzer/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FXEventAnalyzer.xcodeproj \
            -scheme FXEventAnalyzer \
            -derivedDataPath DerivedData

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: gem install fastlane -N

      - name: Validate required secrets are present
        env:
          FX_IOS_DIST_CERT_P12_BASE64: ${{ secrets.FX_IOS_DIST_CERT_P12_BASE64 }}
          FX_IOS_DIST_CERT_PASSWORD: ${{ secrets.FX_IOS_DIST_CERT_PASSWORD }}
          FX_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.FX_IOS_PROVISIONING_PROFILE_BASE64 }}
          FX_IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.FX_IOS_PROVISIONING_PROFILE_NAME }}
          FX_IOS_BUILD_KEYCHAIN_PASSWORD: ${{ secrets.FX_IOS_BUILD_KEYCHAIN_PASSWORD }}
          FX_APPLE_TEAM_ID: ${{ secrets.FX_APPLE_TEAM_ID }}
          FX_ASC_KEY_ID: ${{ secrets.FX_ASC_KEY_ID }}
          FX_ASC_ISSUER_ID: ${{ secrets.FX_ASC_ISSUER_ID }}
          FX_ASC_KEY_P8_BASE64: ${{ secrets.FX_ASC_KEY_P8_BASE64 }}
        run: |
          set -uo pipefail
          REQUIRED_SECRETS="FX_IOS_DIST_CERT_P12_BASE64 FX_IOS_DIST_CERT_PASSWORD FX_IOS_PROVISIONING_PROFILE_BASE64 FX_IOS_PROVISIONING_PROFILE_NAME FX_IOS_BUILD_KEYCHAIN_PASSWORD FX_APPLE_TEAM_ID FX_ASC_KEY_ID FX_ASC_ISSUER_ID FX_ASC_KEY_P8_BASE64"
          MISSING=""
          for name in $REQUIRED_SECRETS; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              MISSING="$MISSING $name"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "Missing or empty required secrets (names only, values not shown):$MISSING" >&2
            exit 1
          fi
          echo "All required secrets are present (values not shown)."

      - name: Create temporary keychain and import distribution certificate
        env:
          FX_IOS_DIST_CERT_P12_BASE64: ${{ secrets.FX_IOS_DIST_CERT_P12_BASE64 }}
          FX_IOS_DIST_CERT_PASSWORD: ${{ secrets.FX_IOS_DIST_CERT_PASSWORD }}
          FX_IOS_BUILD_KEYCHAIN_PASSWORD: ${{ secrets.FX_IOS_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/fx-signing.keychain-db"
          echo "$FX_IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/fx_distribution.p12"

          security create-keychain -p "$FX_IOS_BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$FX_IOS_BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/fx_distribution.p12" -k "$KEYCHAIN_PATH" \
            -P "$FX_IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$FX_IOS_BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')

          rm -f "$RUNNER_TEMP/fx_distribution.p12"

      - name: Install provisioning profile
        env:
          FX_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.FX_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$FX_IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/fx_distribution.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/fx_distribution.mobileprovision" > "$RUNNER_TEMP/fx_profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/fx_profile.plist")
          cp "$RUNNER_TEMP/fx_distribution.mobileprovision" "$PROFILES_DIR/$UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/fx_profile.plist"
          # A修正: 後片付けステップが「今回インストールした1件だけ」を
          # 削除できるよう、UUIDを後続ステップに引き渡す。
          echo "FX_PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Generate ExportOptions.plist
        env:
          FX_APPLE_TEAM_ID: ${{ secrets.FX_APPLE_TEAM_ID }}
          FX_IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.FX_IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/FXExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${FX_APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.fumaono.fxeventanalyzer</key>
                  <string>${FX_IOS_PROVISIONING_PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          PLIST

      - name: Build and upload to TestFlight
        env:
          FX_ASC_KEY_ID: ${{ secrets.FX_ASC_KEY_ID }}
          FX_ASC_ISSUER_ID: ${{ secrets.FX_ASC_ISSUER_ID }}
          FX_ASC_KEY_P8_BASE64: ${{ secrets.FX_ASC_KEY_P8_BASE64 }}
          FX_APPLE_TEAM_ID: ${{ secrets.FX_APPLE_TEAM_ID }}
          FX_IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.FX_IOS_PROVISIONING_PROFILE_NAME }}
          FX_EXPORT_OPTIONS_PLIST_PATH: ${{ runner.temp }}/FXExportOptions.plist
          FX_BUILD_NUMBER: ${{ github.run_number }}
        run: fastlane ios testflight

      - name: Clean up temporary keychain and generated files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/fx-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/fx_distribution.mobileprovision" "$RUNNER_TEMP/FXExportOptions.plist" || true
          # A修正: 今回の実行でインストールした1件(UUIDで特定)だけを削除する。
          # 未設定(Install provisioning profileステップに到達せず失敗した場合)
          # なら何もしない。
          if [ -n "${FX_PROVISIONING_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${FX_PROVISIONING_PROFILE_UUID}.mobileprovision" || true
          fi

      - name: Upload .ipa as build artifact (failure diagnosis only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fx-event-analyzer-testflight-ipa
          path: fx-event-analyzer/build/FXEventAnalyzer.ipa
          if-no-files-found: ignore
