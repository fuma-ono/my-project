name: kashikari iOS manual build (no EAS)

# EAS(eas build)の無料枠を使い切った際の代替経路(100回目)。
# GitHub Actionsの無料macOSランナー上でXcodeビルド→TestFlight提出まで
# 行う。手動トリガー(Actionsタブから「Run workflow」)のみで、pushでは
# 自動起動しない(macOSランナーは無料枠の消費が大きいため)。
#
# 事前に以下のRepository secretsの登録が必要
# (docs/manual-ios-build-setup.mdに詳しい手順あり):
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64  … App Store Connect APIキー
#   IOS_DIST_CERT_P12_BASE64 / IOS_DIST_CERT_PASSWORD … 配布証明書
#   IOS_PROVISIONING_PROFILE_BASE64 / IOS_PROVISIONING_PROFILE_NAME … プロファイル
#   IOS_BUILD_KEYCHAIN_PASSWORD … CI内で作る一時キーチェーンの任意パスワード
#   APPLE_ID / APPLE_TEAM_ID / ASC_TEAM_ID
#   EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY / 他EXPO_PUBLIC_*
#     (.env.example参照。アプリのビルドに埋め込む値)
on:
  workflow_dispatch: {}

jobs:
  build:
    # macos-14のデフォルトXcode(15.4)ではReact Native 0.8x系が要求する
    # Xcode 16.1以上を満たせずpod installが失敗したため、macos-15に変更した
    # 上で、念のためXcodeバージョンも明示的に指定する(初回実行の失敗、
    # 100回目)。
    runs-on: macos-15
    defaults:
      run:
        working-directory: personal-side-projects/kashikari/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode (>= 16.1 required)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm ci

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_LINE_CHANNEL_ID=${{ secrets.EXPO_PUBLIC_LINE_CHANNEL_ID }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY=${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY=${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
          EXPO_PUBLIC_ADMOB_BANNER_IOS=${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_IOS }}
          EXPO_PUBLIC_ADMOB_BANNER_ANDROID=${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_ANDROID }}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS=${{ secrets.EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS }}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID=${{ secrets.EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID }}
          EXPO_PUBLIC_SENTRY_DSN=${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EOF

      - name: Set unique iOS build number
        # app.jsonにios.buildNumberの指定が無く、expo prebuildだと毎回
        # 既定値(1)になってしまう。EAS側は既にビルド18まで進んでいて、
        # App Store Connect上でビルド番号が重複するとCI自体は成功しても
        # TestFlightに反映されない(初回実行の失敗、100回目)。日時ベースの
        # 常に増加するユニークな番号を都度app.jsonに書き込む。
        run: |
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "iOS build number: $BUILD_NUMBER"
          node -e "
            const fs = require('fs');
            const path = 'app.json';
            const json = JSON.parse(fs.readFileSync(path, 'utf8'));
            json.expo.ios = json.expo.ios || {};
            json.expo.ios.buildNumber = '${BUILD_NUMBER}';
            fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n');
          "

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Fastlane
        run: gem install fastlane -N

      - name: Decode signing files
        run: |
          echo "${{ secrets.IOS_DIST_CERT_P12_BASE64 }}" | base64 --decode > ios_distribution.p12
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > distribution.mobileprovision

      - name: Build and upload to TestFlight
        env:
          # Sentryの組織情報(SENTRY_ORG等)を登録していないため、ビルド時の
          # ソースマップ自動アップロードを無効化する(EAS側と同じ対応、
          # 100回目)。未設定のままだとsentry-cliがビルド自体を失敗させる。
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_BUILD_KEYCHAIN_PASSWORD: ${{ secrets.IOS_BUILD_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: fastlane ios release

      - name: Upload .ipa as build artifact (debug用、失敗時の調査に使う)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kashikari-ipa
          path: personal-side-projects/kashikari/mobile/build/kashikari.ipa
          if-no-files-found: ignore
