# JP_CPI の値の dry-run(HQ指示 2026-11-13「11/20 の公表前に、dry-run で実行できる状態まで整える」)。
# - 動くのは、ブランチ verify/fx-jpcpi-values-dryrun への push と、手動の実行だけ(定期実行なし)。
# - 実行するのは ingest:official:jp-cpi-values -- --dry-run だけ(本番の形は動かさない — テストで確かめる)。
#   DB は読むだけで、書かない(ingestion_logs にも書かない)。e-Stat の API は ESTAT_APP_ID(Secret)で呼ぶ。出力に appId は出ない。
# - 11/20 08:30 JST の公表の後、e-Stat に値が出たあとで流し、plan が PUBLISH(値つき)になるのを確かめる。
#   PUBLISH になってから、HQ の承認のもとで本番の取り込み(jp-cpi-values)を行う。
# - 接続先が DEV でなければ止まる。
name: FX Event Analyzer - JP CPI values dry run (DEV)

on:
  push:
    branches:
      - 'verify/fx-jpcpi-values-dryrun'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fx-ingestion
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fx-event-analyzer-backend
    env:
      DEV_PROJECT_REF: pbemckwnqmeaoveelihd
      DEV_PROJECT_URL: https://pbemckwnqmeaoveelihd.supabase.co
      SUPABASE_URL: ${{ secrets.FX_DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FX_DEV_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check secrets and target (DEV only)
        id: check
        working-directory: .
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Secrets が未登録のため何もしません"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${SUPABASE_URL%/}" != "$DEV_PROJECT_URL" ]; then
            echo "接続先が社内確認用のDBではありません。止めます"
            exit 1
          fi
          KEY_REF=$(python3 -c 'import os,base64,json; p=os.environ["SUPABASE_SERVICE_ROLE_KEY"].split("."); print(json.loads(base64.urlsafe_b64decode(p[1]+"="*(-len(p[1])%4))).get("ref","") if len(p)==3 else "")' 2>/dev/null || true)
          if [ "$KEY_REF" != "$DEV_PROJECT_REF" ]; then
            echo "鍵が社内確認用のプロジェクトのものではありません。止めます"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fx-event-analyzer-backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        if: steps.check.outputs.ready == 'true'
      - name: JP CPI values dry run (reads the DB and the e-Stat API; writes nothing)
        if: steps.check.outputs.ready == 'true'
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          set +e
          npm run -s ingest:official:jp-cpi-values -- --dry-run > "$RUNNER_TEMP/jpcpi-values.json" 2> "$RUNNER_TEMP/jpcpi-values.err"
          echo "exit=$?" > "$RUNNER_TEMP/jpcpi-values.exit"
          python3 ../.github/scripts/guarded_apply.py report jpcpi-values "$RUNNER_TEMP/jpcpi-values.json" "$RUNNER_TEMP/jpcpi-values.exit"
