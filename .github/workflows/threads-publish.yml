name: Threads Affiliate - Publish

# pending/にある下書きをThreadsへ実際に投稿する(threads-affiliate/publish.py)。
# 下書きが無ければ何もしない(publish.py側で判定済み)。
# 毎週月・水・金 12:00 JSTに実行する想定。
on:
  schedule:
    - cron: '0 3 * * 1,3,5' # 月・水・金 12:00 JST = 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/note-issue-1pjubh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run publish.py
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python3 threads-affiliate/publish.py

      - name: Commit and push (pending -> published, log)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- threads-affiliate/pending threads-affiliate/published threads-affiliate/publish-log.jsonl
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "投稿を自動公開(GitHub Actions)"
            git fetch origin claude/note-issue-1pjubh
            git rebase origin/claude/note-issue-1pjubh
            git push origin HEAD:claude/note-issue-1pjubh
          fi
