name: Threads Affiliate - Publish

# pending/にある下書きをThreadsへ実際に投稿する(threads-affiliate/publish.py)。
# 下書きが無ければ何もしない(publish.py側で判定済み)。
#
# 2026-09-09、オーナー指示によりPhase 2(完全自動投稿)へ移行した。
# 毎日20:00 JSTの投稿案生成Routineの後、21:00 JST頃にこのワークフローが
# pending/の下書きを自動投稿する。人間のレビューは入らないため、
# publish.py側のPR表記検証(validate_pr_disclosure)が最後の安全弁になる。
# 詳細: docs/marketing/2026-09-09-threads-account-repositioning.md
#
# 2026-09-09: 初回の`0 12 * * *`(毎時00分)が一度も発火しなかった事象が発生。
# GitHub公式ドキュメントで「毎時00分はActions全体の混雑ピークで、
# スケジュール実行が遅延・スキップされやすい」と明記されているため、
# 毎時00分を避けて`5`分にずらした(体感の投稿時刻はほぼ変わらない)。
#
# 2026-09-10: `5`分にずらした後も、スケジュール実行が約4時間遅延する事象が
# 発生(GitHub Actions側の`schedule:`トリガー自体が不安定)。対策として:
#   (a) 無料でできる保険として、下記のように30分おきに3回のバックアップ
#       cronを追加した(publish.pyは下書きが無ければ何もしないだけなので、
#       複数回発火しても無害)
#   (b) さらに、これまで一度も遅延・欠落したことが無いClaude Code Remoteの
#       定期Routine(「Threadsアフィリエイト 投稿を確実に起動」)から、
#       21:05 JSTに直接`workflow_dispatch`でこのワークフローを起動する
#       仕組みも追加した(そちらが本命、これは無料の保険)
on:
  schedule:
    - cron: '5 12 * * *'  # 毎日21:05 JST = 12:05 UTC(本来の時刻、毎時00分の混雑を回避)
    - cron: '35 12 * * *' # 21:35 JST(1回目がスキップ・遅延した場合の保険)
    - cron: '5 13 * * *'  # 22:05 JST(2回目もダメだった場合の保険)
  workflow_dispatch: {}

# 2026-09-11、オーナー指示「完全自動運営の安全基盤」: 複数の起動経路
# (バックアップcron・CCR Routineからの直接起動等)が重なった場合に同じ
# ジョブが同時実行されて重複投稿を起こさないよう、直列化する。
concurrency:
  group: threads-affiliate-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/note-issue-1pjubh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run publish.py
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python3 threads-affiliate/publish.py

      - name: Commit and push (pending -> published, log)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 2026-09-11、最終運用監査で実際に再現: pending/が完全に空(下書き無し)の
          # 状態でcheckoutすると、gitが空ディレクトリを復元しないため
          # `git add -A -- .../pending`が「pathspec did not match any files」で
          # 失敗し、公開処理自体は正常でもジョブ全体がfailure扱いになっていた。
          mkdir -p threads-affiliate/pending threads-affiliate/published
          git add -A -- threads-affiliate/pending threads-affiliate/published threads-affiliate/publish-log.jsonl
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "投稿を自動公開(GitHub Actions)"
            git fetch origin claude/note-issue-1pjubh
            git rebase origin/claude/note-issue-1pjubh
            git push origin HEAD:claude/note-issue-1pjubh
          fi
