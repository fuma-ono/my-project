# DEV の要人発言の読み取り専用の確認(HQ指示 2026-11-12「Actions の既存 Secrets を利用する読み取り専用確認 target」)。
# - 動くのは、ブランチ verify/fx-dev-readonly への push と、手動の実行だけ(定期実行なし)。
# - DB は読むだけ: ジョブは select しか持たない入口(src/ingestion/verify/readOnlyDb.ts)を使う。書き込みの関数を呼べない。
# - 接続先が DEV でなければ止まる(下の確認 + ジョブの中の src/ingestion/devTarget.ts の二重)。PROD には触れない。
# - 出力は件数・状態別の内訳・指紋・id・公式 URL・日時・回数・API の HTTP の状態コードだけ。本文・要約の中身、鍵は出さない。
#   GitHub Actions の注記(::notice)として出す(check-run の注記で読める)。
# - 使う Secret は取り込みのワークフローと同じ FX_DEV_SUPABASE_URL / FX_DEV_SUPABASE_SERVICE_ROLE_KEY(新しい Secret なし)。
name: FX Event Analyzer - DEV read-only verify

on:
  push:
    branches:
      - 'verify/fx-dev-readonly'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fx-dev-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fx-event-analyzer-backend
    env:
      DEV_PROJECT_REF: pbemckwnqmeaoveelihd
      DEV_PROJECT_URL: https://pbemckwnqmeaoveelihd.supabase.co
      DEV_API_BASE_URL: https://fx-event-analyzer-api-dev.onrender.com
      SUPABASE_URL: ${{ secrets.FX_DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FX_DEV_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check secrets and target (DEV only)
        id: check
        working-directory: .
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Secrets が未登録のため何もしません"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${SUPABASE_URL%/}" != "$DEV_PROJECT_URL" ]; then
            echo "接続先が社内確認用のDBではありません。読まずに止めます"
            exit 1
          fi
          KEY_REF=$(python3 -c 'import os,base64,json; p=os.environ["SUPABASE_SERVICE_ROLE_KEY"].split("."); print(json.loads(base64.urlsafe_b64decode(p[1]+"="*(-len(p[1])%4))).get("ref","") if len(p)==3 else "")' 2>/dev/null || true)
          if [ "$KEY_REF" != "$DEV_PROJECT_REF" ]; then
            echo "鍵が社内確認用のプロジェクトのものではありません(または形式が違います)。読まずに止めます"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fx-event-analyzer-backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        if: steps.check.outputs.ready == 'true'
      - name: Read-only verify (speeches, DEV)
        if: steps.check.outputs.ready == 'true'
        run: npm run -s verify:speeches-dev
