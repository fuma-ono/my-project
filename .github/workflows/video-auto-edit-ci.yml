name: video-auto-edit-ci

# 動画自動編集AI(VAE)専用。VAE のファイルが変わったときだけ動く(他事業の CI には影響しない)
on:
  pull_request:
    paths:
      - "personal-side-projects/video-auto-edit/**"
      - ".github/workflows/video-auto-edit-ci.yml"
      - ".claude/hooks/**"
      - ".claude/settings.json"
  push:
    branches:
      - "claude/video-autoedit-**"
    paths:
      - "personal-side-projects/video-auto-edit/**"
      - ".github/workflows/video-auto-edit-ci.yml"
      - ".claude/hooks/**"
      - ".claude/settings.json"
  workflow_dispatch:
    inputs:
      slow:
        description: "実モデル(Whisper small)の統合テストも実行する"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: video-auto-edit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: personal-side-projects/video-auto-edit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: personal-side-projects/video-auto-edit/pyproject.toml
      - name: System packages (FFmpeg, IPA font)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-ipafont-gothic
      - name: Install
        run: python -m pip install -q -e ".[test,bgm]"
      - name: Hook tests
        working-directory: .
        run: python .claude/hooks/test_vae_hooks.py
      - name: Fast tests
        run: python -m pytest -m "not slow" -q -p no:cacheprovider
      - name: Slow tests (real Whisper small)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.slow }}
        env:
          VAE_TEST_MODEL: small
        run: python -m pytest -m slow -q -p no:cacheprovider
