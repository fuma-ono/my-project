name: FX Event Analyzer Backend — DB Migration Validation

# Validates that supabase/migrations/*.sql and supabase/seed.sql apply
# cleanly against a real Supabase stack (Postgres + the auth schema our
# RLS policies and profiles.id FK depend on — a plain Postgres container
# would not have `auth.users`/`auth.uid()`/`auth.role()` at all, so this
# uses the actual Supabase CLI local stack rather than a bare `postgres`
# service image).
#
# This is the "migration validation" leg of Phase 2's CI requirement.
# Backend lint/unit/integration test jobs are not added yet — they depend
# on a Backend language/framework decision that hasn't been made (see
# fx-event-analyzer-backend/README.md and the Phase 2 report).

on:
  push:
    paths:
      - "fx-event-analyzer-backend/supabase/**"
      - ".github/workflows/fx-event-analyzer-backend-db.yml"
  pull_request:
    paths:
      - "fx-event-analyzer-backend/supabase/**"
  workflow_dispatch: {}

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fx-event-analyzer-backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset DB (re-applies every migration + seed.sql from scratch)
        run: supabase db reset

      - name: Stop Supabase stack
        if: always()
        run: supabase stop
