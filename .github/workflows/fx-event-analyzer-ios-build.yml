name: FX Event Analyzer iOS Build & Test

# FX Event Analyzer is SwiftUI-native and has no local build/test tooling
# (the development environment for this project is Linux — see
# docs/projects/fx-event-analyzer/README.md Phase 0 audit). This workflow is
# the only place that can actually build and run its test suite.
#
# No Apple Developer Team / certificate / provisioning profile exists yet,
# so code signing is disabled (CODE_SIGNING_ALLOWED=NO) — this workflow
# builds and runs unit tests on the Simulator only, no TestFlight
# submission. See fx-event-analyzer/README.md.
#
# SUPABASE_URL / SUPABASE_ANON_KEY / API_BASE_URL are read from repo
# secrets (FX_SUPABASE_URL / FX_SUPABASE_ANON_KEY / FX_API_BASE_URL). Until
# a real Supabase project and a deployed Backend exist these are simply
# unset, which GitHub Actions resolves to an empty string — the app is
# built to handle that without crashing (see
# FXEventAnalyzer/Auth/SupabaseConfig.swift and
# Networking/APIClient.swift's defaultBaseURLProvider), so an unconfigured
# build is expected to succeed, not fail.
#
# GOOGLE_SIGNIN_CLIENT_ID / GOOGLE_SIGNIN_REVERSED_CLIENT_ID (secrets
# FX_GOOGLE_SIGNIN_CLIENT_ID / FX_GOOGLE_SIGNIN_REVERSED_CLIENT_ID) are the
# same kind of blank-by-default value, for native Google Sign-In
# (GoogleSignInCoordinator checks for an empty Client ID itself before
# calling the SDK, same policy as Supabase above).
#
# This project is entirely independent of personal-side-projects/kashikari/
# (separate Bundle ID, separate Supabase project, no shared secrets) — see
# fx-event-analyzer/README.md "What this is not".

on:
  push:
    paths:
      - "fx-event-analyzer/**"
      - ".github/workflows/fx-event-analyzer-ios-build.yml"
  pull_request:
    paths:
      - "fx-event-analyzer/**"
      - ".github/workflows/fx-event-analyzer-ios-build.yml"
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: fx-event-analyzer
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Cache Swift Package Manager artifacts
        uses: actions/cache@v4
        with:
          path: fx-event-analyzer/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('fx-event-analyzer/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FXEventAnalyzer.xcodeproj \
            -scheme FXEventAnalyzer \
            -derivedDataPath DerivedData

      - name: Select an available iPhone Simulator
        id: simulator
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone")) | .name' \
            | head -n1)
          if [ -z "$DEVICE_NAME" ]; then
            echo "No available iPhone simulator found on this runner image." >&2
            exit 1
          fi
          echo "Using simulator: $DEVICE_NAME"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.FX_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.FX_SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.FX_API_BASE_URL }}
          GOOGLE_SIGNIN_CLIENT_ID: ${{ secrets.FX_GOOGLE_SIGNIN_CLIENT_ID }}
          GOOGLE_SIGNIN_REVERSED_CLIENT_ID: ${{ secrets.FX_GOOGLE_SIGNIN_REVERSED_CLIENT_ID }}
        run: |
          xcodebuild build \
            -project FXEventAnalyzer.xcodeproj \
            -scheme FXEventAnalyzer \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device_name }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            API_BASE_URL="$API_BASE_URL" \
            GOOGLE_SIGNIN_CLIENT_ID="$GOOGLE_SIGNIN_CLIENT_ID" \
            GOOGLE_SIGNIN_REVERSED_CLIENT_ID="$GOOGLE_SIGNIN_REVERSED_CLIENT_ID"

      # HQ指示(2026-10-22「A1差分レビュー・iPad向き設定修正・次回ビルド準備」):
      # TestFlight実行#16(run 39438349394)がApp Store Connectのアップロード時
      # バリデーションで409エラーになった原因(iPadのマルチタスク対応には
      # UISupportedInterfaceOrientationsに4方向すべてが必要)の再発防止。
      # project.ymlの設定値だけでなく、実際にXcodeGen+xcodebuildが生成した
      # .appバンドルのInfo.plistそのものを検証する(project.ymlのキー名の
      # 誤り・XcodeGenの反映漏れ等も検出できるようにするため)。
      - name: Verify generated Info.plist orientations (iPhone portrait-only, iPad all 4)
        run: |
          APP_PATH="DerivedData/Build/Products/Debug-iphonesimulator/FXEventAnalyzer.app"
          PLIST="$APP_PATH/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error::Info.plist not found at $PLIST (build output layout may have changed)"
            exit 1
          fi

          IPHONE=$(/usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$PLIST" 2>&1) || {
            echo "::error::UISupportedInterfaceOrientations key is missing from the generated Info.plist"
            exit 1
          }
          IPAD=$(/usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>&1) || {
            echo "::error::UISupportedInterfaceOrientations~ipad key is missing from the generated Info.plist"
            exit 1
          }

          echo "iPhone (UISupportedInterfaceOrientations):"
          echo "$IPHONE"
          echo "iPad (UISupportedInterfaceOrientations~ipad):"
          echo "$IPAD"

          # iPhone: Portraitのみ(横画面禁止を維持)。
          if ! echo "$IPHONE" | grep -q "UIInterfaceOrientationPortrait"; then
            echo "::error::iPhone's UISupportedInterfaceOrientations must include UIInterfaceOrientationPortrait"
            exit 1
          fi
          if echo "$IPHONE" | grep -qE "LandscapeLeft|LandscapeRight|PortraitUpsideDown"; then
            echo "::error::iPhone's UISupportedInterfaceOrientations must be Portrait-only (横画面禁止の方針に反する値が含まれています)"
            exit 1
          fi

          # iPad: 縦・横の4方向すべて(Appleのアップロード時バリデーション要件、409エラーの再発防止)。
          for dir in UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight; do
            if ! echo "$IPAD" | grep -q "$dir"; then
              echo "::error::iPad's UISupportedInterfaceOrientations~ipad is missing $dir — Appleのアップロード時バリデーションがiPadのマルチタスク対応のため4方向すべてを要求する(TestFlight run #16の409エラーの再発防止)"
              exit 1
            fi
          done

          echo "Orientation check passed: iPhone=Portrait-only, iPad=all 4 directions"

      - name: Test
        env:
          SUPABASE_URL: ${{ secrets.FX_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.FX_SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.FX_API_BASE_URL }}
          GOOGLE_SIGNIN_CLIENT_ID: ${{ secrets.FX_GOOGLE_SIGNIN_CLIENT_ID }}
          GOOGLE_SIGNIN_REVERSED_CLIENT_ID: ${{ secrets.FX_GOOGLE_SIGNIN_REVERSED_CLIENT_ID }}
        run: |
          xcodebuild test \
            -project FXEventAnalyzer.xcodeproj \
            -scheme FXEventAnalyzer \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device_name }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            API_BASE_URL="$API_BASE_URL" \
            GOOGLE_SIGNIN_CLIENT_ID="$GOOGLE_SIGNIN_CLIENT_ID" \
            GOOGLE_SIGNIN_REVERSED_CLIENT_ID="$GOOGLE_SIGNIN_REVERSED_CLIENT_ID"
