name: Threads Affiliate - Fetch Replies

# 投稿への新着コメントを取得する(threads-affiliate/fetch_replies.py)。
#
# 2026-09-11: 完全自動返信(モードA)の一部。当初はClaude Code Remoteの定期
# Routineがfetch_replies.py自体を実行する設計だったが、そのセッションからは
# graph.threads.netへの接続がブロックされている(publish.pyと同じ制約)ことが
# 判明したため、Threads APIへの接続が必要な部分はGitHub Actions側に分離した。
#
# 全体の流れ(2時間おき、20分刻みでずらして競合を避ける):
#   :10 このワークフロー(fetch) → replies-pending.jsonをコミット
#   :30 Claude Code Remoteの「Threads返信 自動対応」Routine(判断)
#       → reply-decisions.jsonをコミット
#   :50 threads-send-replies.yml(send) → 実際に返信を投稿しログを記録
#
# 詳細: threads-affiliate/README.md、docs/marketing/2026-09-10-threads-auto-reply-guardrails.md
on:
  schedule:
    - cron: '10 */2 * * *' # 2時間おき、毎時10分(毎時00分の混雑を回避)
  workflow_dispatch: {}

# 2026-09-11、オーナー指示「完全自動運営の安全基盤」: 実行が重ならないよう直列化する。
concurrency:
  group: threads-affiliate-fetch-replies
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/note-issue-1pjubh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetch_replies.py
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python3 threads-affiliate/fetch_replies.py

      - name: Commit and push replies-pending.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- threads-affiliate/replies-pending.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "返信の新着コメントを取得(GitHub Actions)"
            git fetch origin claude/note-issue-1pjubh
            git rebase origin/claude/note-issue-1pjubh
            git push origin HEAD:claude/note-issue-1pjubh
          fi
