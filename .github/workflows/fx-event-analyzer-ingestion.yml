name: FX Event Analyzer - Data ingestion (dev)

# 社内確認用DB へ本番データを取り込み、品質レポートを作る(docs/projects/fx-event-analyzer/dev-environment.md)。
#   - 為替: 20分ごと。Twelve Data の1分足 → fx_prices(5分〜60分足も組み立て)
#   - 要人発言: 1日2回(06:15 / 18:15 JST)。FRB カレンダー・ECB RSS → speech_events
#   - 品質レポート: 毎日 09:00 JST、直近1日分。DB を読むだけ。結果は実行の Summary に出る
#   - BLS公式統計の経済カレンダー(手動実行は target=official-bls): 有料カレンダーに
#     依存しない独立経路(HQ判断2026-10-17)。BLSの公式スケジュール(無料・キー不要)
#     から米国5指標のeconomic_eventsを作る
#   - BLSの定時実行(HQ指示2026-10-27): 平日 13:37 / 17:37 UTC。発表(NY 08:30 = 夏時間 12:30Z /
#     冬時間 13:30Z)の後に `--scheduled --if-due` で動く。発表時刻を過ぎたのにまだ値の入っていない
#     発表があるときだけ BLS を呼ぶ(無い日は BLS を1回も呼ばない)。17:37 は 13:37 の失敗・遅延の取り直し。
#     BLS への HTTP は1回ごとに api_credit_ledger で予約する(定期は1日16回まで、合計24回まで)
#     手動で同じ判定を試すときは target=official-bls-if-due(台帳には MANUAL として数える)
#   - 経済指標の価格反応(target=event-reactions): HQ決定2026-10-18。既存のfx_prices/economic_events
#     を読むだけで、外部APIは呼ばない(追加費用0円)。HQ判断2026-10-27「反応ジョブの定時実行」で、
#     毎時 57 分(為替の 7・27・47 分、BLS の 37 分と重ならない)に直近7日の発表を計算する。
#     同じ値の行は書かず、値のある行を値の無い行で上書きしない。失敗しても次の時間に取り直す
#   - 期間を指定した反応の計算し直し(手動実行のみ、target=event-reactions-range、入力 from・to): 過去の発表のバックフィル
#   - 過去の為替1分足の取得の試し(手動実行のみ、target=fx-history-probe): Twelve Data に最大5回。DB には書かない
#   - FOMCの会合日程(手動実行のみ、target=fomc-schedule): HQ承認2026-10-26。コードレビュー済みの
#     表(ingestion/mappings/fomcSchedule.ts)から US_FOMC の発表予定を economic_events に入れる。
#     外部APIは呼ばない。migration 20261022000002(is_provisional)が前提。定期実行には入れない
#   - BLS公式統計の経済カレンダーの書き込みなしの事前実行(手動実行のみ、target=official-bls-dry-run):
#     HQ承認2026-10-27(D-1)。`--dry-run` で DB には何も書かない(ingestion_logs にも書かない)。
#     書き込む関数をすべて断るストアで、内訳(plan)と書くはずだった内容をログに出すだけ。
#     DB は読む。BLS の API は読む(キーなしの v1 は25回/日。1回の実行で系列ごとに1回)
# 接続先が社内確認用のDBでなければ止まる(本番DBに書き込まない)。
# Twelve Data の無料キーは社内確認専用(要件定義書6.4)。
on:
  schedule:
    - cron: '7,27,47 * * * *'
    - cron: '15 21,9 * * *'
    - cron: '0 0 * * *'
    - cron: '37 13,17 * * 1-5'
    - cron: '57 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'fx-prices / speeches / both / report / official-bls / official-bls-dry-run / official-bls-if-due / event-reactions / event-reactions-range / fx-history-probe / fomc-schedule'
        default: both
      from:
        description: 'event-reactions-range だけ: 開始(ISO 8601、例 2026-01-01T00:00:00Z)'
        required: false
        default: ''
      to:
        description: 'event-reactions-range だけ: 終了(含まない。ISO 8601)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: fx-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fx-event-analyzer-backend
    env:
      DEV_PROJECT_REF: pbemckwnqmeaoveelihd
      DEV_PROJECT_URL: https://pbemckwnqmeaoveelihd.supabase.co
      SUPABASE_URL: ${{ secrets.FX_DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FX_DEV_SUPABASE_SERVICE_ROLE_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.FX_TWELVE_DATA_API_KEY }}
    steps:
      - name: Check secrets and target
        id: check
        working-directory: .
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Secrets が未登録のため何もしません"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${SUPABASE_URL%/}" != "$DEV_PROJECT_URL" ]; then
            echo "接続先が社内確認用のDBではありません。書き込まずに止めます"
            exit 1
          fi
          # 鍵の中身(JWT)に書かれたプロジェクトも社内確認用か確かめる。鍵そのものは出力しない。
          KEY_REF=$(python3 -c 'import os,base64,json; p=os.environ["SUPABASE_SERVICE_ROLE_KEY"].split("."); print(json.loads(base64.urlsafe_b64decode(p[1]+"="*(-len(p[1])%4))).get("ref","") if len(p)==3 else "")' 2>/dev/null || true)
          if [ "$KEY_REF" != "$DEV_PROJECT_REF" ]; then
            echo "鍵が社内確認用のプロジェクトのものではありません(または形式が違います)。書き込まずに止めます"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          ref: claude/fx-settings-screens
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fx-event-analyzer-backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        if: steps.check.outputs.ready == 'true'
      - name: FX prices
        if: steps.check.outputs.ready == 'true' && (github.event.schedule == '7,27,47 * * * *' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'fx-prices' || inputs.target == 'both')))
        run: npm run -s ingest:fx-prices -- ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}
      - name: Event reactions (経済指標の価格反応、毎時57分・手動)
        if: steps.check.outputs.ready == 'true' && (github.event.schedule == '57 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.target == 'event-reactions'))
        run: npm run -s ingest:event-reactions
      - name: Event reactions for a range (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'event-reactions-range'
        env:
          RANGE_FROM: ${{ inputs.from }}
          RANGE_TO: ${{ inputs.to }}
        run: npm run -s ingest:event-reactions -- --from "$RANGE_FROM" --to "$RANGE_TO"
      - name: FX history probe (Twelve Data, at most 5 requests, no DB writes, manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'fx-history-probe'
        run: npm run -s probe:fx-history
      - name: Speeches
        if: steps.check.outputs.ready == 'true' && (github.event.schedule == '15 21,9 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'speeches' || inputs.target == 'both')))
        run: npm run -s ingest:speeches
      - name: Data quality report
        if: steps.check.outputs.ready == 'true' && (github.event.schedule == '0 0 * * *' || (github.event_name == 'workflow_dispatch' && inputs.target == 'report'))
        run: npm run -s report:data-quality -- --days 1
      - name: Official stats (BLS calendar, manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'official-bls'
        run: npm run -s ingest:official:bls-calendar
      - name: Official stats (BLS calendar, scheduled, only when a release is due)
        if: steps.check.outputs.ready == 'true' && github.event.schedule == '37 13,17 * * 1-5'
        run: npm run -s ingest:official:bls-calendar -- --scheduled --if-due
      - name: Official stats (BLS calendar, manual, only when a release is due)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'official-bls-if-due'
        run: npm run -s ingest:official:bls-calendar -- --if-due
      - name: Official stats (BLS calendar) dry run, no DB writes (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'official-bls-dry-run'
        run: npm run -s ingest:official:bls-calendar -- --dry-run
      - name: FOMC schedule (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'fomc-schedule'
        run: npm run -s ingest:fomc-schedule
