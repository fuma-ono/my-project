name: FX Event Analyzer - Data ingestion (dev)

# 社内確認用DB へ本番データを取り込み、品質レポートを作る(docs/projects/fx-event-analyzer/dev-environment.md)。
#   - 為替: 20分ごと。Twelve Data の1分足 → fx_prices(5分〜60分足も組み立て)
#     HQ承認 2026-11-10 案A: GitHub の定時は間引かれる(実績 1日5〜10回)ので、毎時13分の起動1回の中で
#     20分ごとに ingest:fx-prices を繰り返す(1回の実行は最長約5時間35分、ジョブの上限 6時間の内側)。
#     実行中に来た起動は為替専用のグループ(fx-prices-loop)で1件だけ待ち、終わればすぐ次が始まる(2件目以降の
#     待ちは GitHub が取り消す)。クレジットは今までどおり DB の台帳(定時 700/日・手動込み 800/日)が守る。
#     1回の取り込みが失敗しても繰り返しは続け(次の回が直近7日の抜けを取り直す)、終わりに失敗があれば実行を失敗にする。
#   - 要人発言: 3時間ごと(毎時 41 分、UTC 0・3・6・…・21 時)。FRB カレンダー・ECB RSS → speech_events
#     (HQ判断 2026-10-29 C: GitHub の定時の遅れ・間引きがあっても反映を早める。毎正時と為替の :07/:27/:47 を外す)
#   - 品質レポート: 毎日 09:00 JST、直近1日分。DB を読むだけ。結果は実行の Summary に出る
#   - BLS公式統計の経済カレンダー(手動実行のみ、target=official-bls): 有料カレンダーに
#     依存しない独立経路(HQ判断2026-10-17)。BLSの公式スケジュール(無料・キー不要)
#     からUS_CPI・US_NFPのeconomic_eventsを作る。定期実行には入れていない
#   - 経済指標の価格反応(手動実行のみ、target=event-reactions): HQ決定2026-10-18
#     「経済指標の価格反応実装と異常系テストを進める」。既存のfx_prices/economic_events
#     を読むだけで、外部APIは呼ばない(追加費用0円)。手動実行とDEVデータ検証が
#     成功するまで定期実行には入れない(HQ決定2026-10-18「定期実行への移行条件」)。
#   - FOMCの会合日程(手動実行のみ、target=fomc-schedule): HQ承認2026-10-26。コードレビュー済みの
#     表(ingestion/mappings/fomcSchedule.ts)から US_FOMC の発表予定を economic_events に入れる。
#     migration 20261022000002(is_provisional)が前提。定期実行には入れない。HQ指示2026-11-05: 同じ実行で
#     FOMC議事要旨(US_FOMC_MINUTES)も入れ、FRB の公式カレンダー(calendar.json、無料・キー不要、1回)を読んで
#     表に無い会合の議事要旨だけを足す(取れなければ表だけ)。会合の予定は今までどおり表だけ
#   - FOMCの政策金利(手動実行のみ、target=fomc-policy-rate): HQ承認2026-11-05 案A。NY連銀 Markets Data API
#     (無料・キー不要、1回)の誘導目標レンジを fomc_policy_decisions に入れる。economic_events は変えない。
#     migration 20261105000001(fomc_policy_decisions)が前提(無ければ表を読むところで止まり、政策金利は書かない。実行の記録は ingestion_logs に残る)。
#     定期実行には入れていない
#   - 米国小売売上高の発表予定(手動実行のみ、target=retail-sales-schedule): HQ承認2026-11-05。人が確認した表
#     (ingestion/mappings/retailSalesSchedule.ts)から US_RETAIL_SALES の予定を economic_events に入れる。外部APIは
#     呼ばない。値は入れない。migration 20261105000002(US_RETAIL_SALES の指標)が前提(無ければエラーにして予定は書かない。実行の記録は ingestion_logs に残る)。
#     定期実行には入れていない
#   - BLS公式統計の経済カレンダーの書き込みなしの事前実行(手動実行のみ、target=official-bls-dry-run):
#     HQ承認2026-10-27(D-1)。`--dry-run` で DB には何も書かない(ingestion_logs にも書かない)。
#     書き込む関数をすべて断るストアで、内訳(plan)と書くはずだった内容をログに出すだけ。
#     DB は読む。BLS の API は読む(キーなしの v1 は25回/日。1回の実行で系列ごとに1回)
#   - BLS が前年比の元の月を公表していない回(手動実行のみ、target=official-bls-data-unavailable /
#     official-bls-data-unavailable-dry-run): HQ指示 2026-11-11「CPI 2026-11-10 DATA_UNAVAILABLE 対応(案A)」。
#     mappings/blsDataUnavailable.ts の表の回(US_CPI・US_CORE_CPI の 2026-10)だけを RELEASED・DATA_UNAVAILABLE にし、
#     理由と出典を event_explanations に入れる(値は入れない)。BLS の API は1回。dry-run は DB に書かない。定期実行には入れない
#   - Eurostat の経済カレンダー(手動実行のみ、target=official-eurostat / official-eurostat-dry-run): HQ指示2026-10-30
#     「ユーロ圏経済指標」。Eurostat の公表日程と値(無料・キー不要、1回の実行で3回)から EU_HICP・EU_UNEMPLOYMENT_RATE。
#     dry-run は DB に書かない(ingestion_logs にも書かない)。定期実行には入れていない
#   - 要人発言の本文と要約(手動実行のみ、target=speech-bodies-dry-run / speech-bodies / speech-summaries-dry-run /
#     speech-summaries): HQ承認 2026-11-11。どれも過去のすべての発言(--all)。本文は FRB だけ保存(ECB は権利が未確認の
#     ため URL だけ)。要約は原文の抜粋(EXTRACTIVE_EN、外部 API なし)。dry-run は DB に書かない(ingestion_logs にも書かない)。
#     本文の dry-run は本文のページを読まない。migration 20261110000001・20261111000001 が前提。定期実行には入れていない
#   - 英国・豪州・カナダの経済指標(手動実行のみ、target=gb-au-ca-schedules-dry-run / gb-au-ca-schedules /
#     official-values-dry-run / official-values): HQ指示 2026-11-13。公表予定(コードの表。外部アクセスなし)と、公式の
#     API(ONS・ABS・StatCan)の初回値。dry-run は DB に書かない(ingestion_logs にも書かない)。migration 20261110000002 が前提。
#     定期実行には入れていない
#   - 日本の CPI(JP_CPI、手動実行のみ、target=jp-cpi-schedule-dry-run / jp-cpi-schedule / jp-cpi-values-dry-run / jp-cpi-values): HQ指示 2026-11-12
#     「JP_CPI の事前準備」。e-Stat の公表予定(コードの表)と、公表後の全国・総合の前年同月比(e-Stat API、
#     Secret ESTAT_APP_ID。出力・ログには出さない)。dry-run は DB に書かない。定期実行には入れていない。
#     HQ の承認の後に有効にする(このブランチは未統合)
# 接続先が社内確認用のDBでなければ止まる(本番DBに書き込まない)。
# Twelve Data の無料キーは社内確認専用(要件定義書6.4)。
on:
  schedule:
    - cron: '13 * * * *'
    - cron: '41 */3 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'fx-prices / speeches / both / report / official-bls / official-bls-dry-run / official-eurostat / official-eurostat-dry-run / event-reactions / fomc-schedule / fomc-policy-rate / retail-sales-schedule / official-bls-data-unavailable / official-bls-data-unavailable-dry-run / speech-bodies-dry-run / speech-bodies / speech-summaries-dry-run / speech-summaries / gb-au-ca-schedules-dry-run / gb-au-ca-schedules / official-values-dry-run / official-values / jp-cpi-schedule-dry-run / jp-cpi-schedule / jp-cpi-values-dry-run / jp-cpi-values'
        default: both
      event_id:
        description: 'target=event-reactions のときだけ: この1件だけを計算する(UUID。空なら直近7日の発表。HQ指示 2026-11-10。政策金利が記録済みの FOMC も可)'
        required: false
        default: ''

permissions:
  contents: read

# HQ判断 2026-10-29 B: 要人発言だけの実行(定時と、手動の target=speeches)は別のグループにして、為替などの待ちに
# 押し出されないようにする。それ以外(為替・品質レポート・BLS・反応・FOMC・手動の both など)は今までどおり fx-ingestion。
# 書く表が別(speech_events と fx_prices 等。ingestion_logs は行を足すだけ)なので、同時に動いても衝突しない。
# HQ承認 2026-10-30: Eurostat の手動の実行(target=official-eurostat / official-eurostat-dry-run)は専用のグループにして、
# 為替などの実行・待ちを取り消さない(待ちに押し出されもしない)。要人発言・それ以外の振り分けは今までどおり。
concurrency:
  # HQ承認 2026-11-10 案A: 為替の繰り返し(毎時13分の起動)は専用のグループ。最長約5時間半占有するので、
  # fx-ingestion(BLS・反応・FOMC・手動の為替など)と分け、手動の実行を待たせない。
  group: ${{ github.event.schedule == '13 * * * *' && 'fx-prices-loop' || ((github.event.schedule == '41 */3 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'speeches' || startsWith(inputs.target, 'speech-')))) && 'fx-ingestion-speeches' || ((github.event_name == 'workflow_dispatch' && (inputs.target == 'official-eurostat' || inputs.target == 'official-eurostat-dry-run')) && 'fx-ingestion-eurostat' || 'fx-ingestion')) }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 為替の繰り返しは 355 分(GitHub のジョブの上限 360 分の内側)。それ以外は今までどおり 10 分。
    timeout-minutes: ${{ github.event.schedule == '13 * * * *' && 355 || 10 }}
    defaults:
      run:
        working-directory: fx-event-analyzer-backend
    env:
      DEV_PROJECT_REF: pbemckwnqmeaoveelihd
      DEV_PROJECT_URL: https://pbemckwnqmeaoveelihd.supabase.co
      SUPABASE_URL: ${{ secrets.FX_DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FX_DEV_SUPABASE_SERVICE_ROLE_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.FX_TWELVE_DATA_API_KEY }}
    steps:
      - name: Check secrets and target
        id: check
        working-directory: .
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Secrets が未登録のため何もしません"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${SUPABASE_URL%/}" != "$DEV_PROJECT_URL" ]; then
            echo "接続先が社内確認用のDBではありません。書き込まずに止めます"
            exit 1
          fi
          # 鍵の中身(JWT)に書かれたプロジェクトも社内確認用か確かめる。鍵そのものは出力しない。
          KEY_REF=$(python3 -c 'import os,base64,json; p=os.environ["SUPABASE_SERVICE_ROLE_KEY"].split("."); print(json.loads(base64.urlsafe_b64decode(p[1]+"="*(-len(p[1])%4))).get("ref","") if len(p)==3 else "")' 2>/dev/null || true)
          if [ "$KEY_REF" != "$DEV_PROJECT_REF" ]; then
            echo "鍵が社内確認用のプロジェクトのものではありません(または形式が違います)。書き込まずに止めます"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          ref: claude/fx-settings-screens
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fx-event-analyzer-backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        if: steps.check.outputs.ready == 'true'
      - name: FX prices (loop, every 20 minutes within one run)
        if: steps.check.outputs.ready == 'true' && github.event.schedule == '13 * * * *'
        # 定時(AUTOMATIC、台帳の 700/日)。--manual は付けない。1回の取り込みは 10 分で打ち切る。
        # 次の回は「前の回の開始 + 20 分」に始める。次の回の開始が締め切り(開始から 335 分)を過ぎるなら終える。
        run: |
          deadline=$(( $(date +%s) + 335 * 60 ))
          runs=0
          failures=0
          while :; do
            runs=$((runs + 1))
            started=$(date +%s)
            if ! timeout 10m npm run -s ingest:fx-prices; then
              failures=$((failures + 1))
              echo "::warning::FX prices: run ${runs} failed (the next run re-fetches missing minutes of the last 7 days)"
            fi
            next=$(( started + 20 * 60 ))
            if [ "$next" -ge "$deadline" ]; then break; fi
            pause=$(( next - $(date +%s) ))
            if [ "$pause" -gt 0 ]; then sleep "$pause"; fi
          done
          echo "FX prices loop: runs=${runs} failures=${failures}"
          echo "FX prices loop: runs=${runs} failures=${failures}" >> "$GITHUB_STEP_SUMMARY"
          [ "$failures" -eq 0 ]
      - name: FX prices
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && (inputs.target == 'fx-prices' || inputs.target == 'both')
        run: npm run -s ingest:fx-prices -- --manual
      - name: Event reactions (経済指標の価格反応、手動実行のみ・HQ承認待ちで定期実行には入れない)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'event-reactions'
        # HQ指示(2026-11-10「FOMC 案3」): event_id を入れたときだけ --event-id で1件だけを計算する。値は環境変数で渡し、
        # UUID の形でなければ何もせずに止める(コマンドに直接埋め込まない)。--event-id を知らない古い Backend では
        # 1件に絞られないので、Backend(claude/fx-fomc-reactions)が settings に入るまで event_id は使わない。
        env:
          EVENT_ID: ${{ inputs.event_id }}
        run: |
          if [ -z "$EVENT_ID" ]; then
            npm run -s ingest:event-reactions
          elif printf '%s' "$EVENT_ID" | grep -Eqx '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'; then
            npm run -s ingest:event-reactions -- --event-id "$EVENT_ID"
          else
            echo "event_id は UUID の形で入れてください(何もせずに止めます)"
            exit 1
          fi
      - name: Speeches
        if: steps.check.outputs.ready == 'true' && (github.event.schedule == '41 */3 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'speeches' || inputs.target == 'both')))
        run: npm run -s ingest:speeches
      # 要人発言の本文と要約(HQ承認 2026-11-11「要人発言の定期実行」): 3時間ごとの定期の回だけ、発言の取り込みの後に
      # 別のステップとして順に動かす。!cancelled(): 前のステップ(発言の取り込み・本文)が失敗しても動く(失敗は
      # ジョブの失敗として残り、通知される。continue-on-error は使わない)。対象は発言日時が直近14日、本文は FRB だけ、
      # PENDING・FAILED とも1行3回まで。DEV の確認(steps.check)に加えて、ジョブの中でも接続先が DEV であることを確かめる。
      - name: Speech bodies (scheduled, last 14 days, FRB only)
        if: ${{ !cancelled() && steps.check.outputs.ready == 'true' && github.event_name == 'schedule' && github.event.schedule == '41 */3 * * *' }}
        run: npm run -s ingest:speech-bodies -- --scheduled
      - name: Speech summaries (scheduled, last 14 days, extractive)
        if: ${{ !cancelled() && steps.check.outputs.ready == 'true' && github.event_name == 'schedule' && github.event.schedule == '41 */3 * * *' }}
        run: npm run -s ingest:speech-summaries -- --scheduled
      - name: Data quality report
        if: steps.check.outputs.ready == 'true' && (github.event.schedule == '0 0 * * *' || (github.event_name == 'workflow_dispatch' && inputs.target == 'report'))
        run: npm run -s report:data-quality -- --days 1
      - name: Official stats (BLS calendar, manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'official-bls'
        run: npm run -s ingest:official:bls-calendar
      - name: Official stats (BLS calendar) dry run, no DB writes (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'official-bls-dry-run'
        run: npm run -s ingest:official:bls-calendar -- --dry-run
      - name: BLS releases without a computable value, dry run, no DB writes (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'official-bls-data-unavailable-dry-run'
        run: npm run -s ingest:official:bls-data-unavailable -- --dry-run
      - name: BLS releases without a computable value (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'official-bls-data-unavailable'
        run: npm run -s ingest:official:bls-data-unavailable
      - name: FOMC schedule (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'fomc-schedule'
        run: npm run -s ingest:fomc-schedule
      - name: FOMC policy rate (NY Fed target range, manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'fomc-policy-rate'
        run: npm run -s ingest:fomc-policy-rate
      - name: US retail sales schedule (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'retail-sales-schedule'
        run: npm run -s ingest:retail-sales-schedule
      - name: Official stats (Eurostat calendar) dry run, no DB writes (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'official-eurostat-dry-run'
        run: npm run -s ingest:official:eurostat-calendar -- --dry-run
      - name: Official stats (Eurostat calendar, manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'official-eurostat'
        run: npm run -s ingest:official:eurostat-calendar
      - name: Speech bodies (all past speeches) dry run, no DB writes, no body pages (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'speech-bodies-dry-run'
        run: npm run -s ingest:speech-bodies -- --all --dry-run
      - name: Speech bodies (all past speeches, FRB bodies only; manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'speech-bodies'
        run: npm run -s ingest:speech-bodies -- --all
      - name: Speech summaries (extractive, all past speeches) dry run, no DB writes (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'speech-summaries-dry-run'
        run: npm run -s ingest:speech-summaries -- --all --dry-run
      - name: Speech summaries (extractive, all past speeches; manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'speech-summaries'
        run: npm run -s ingest:speech-summaries -- --all
      - name: GB/AU/CA release schedules dry run, no DB writes (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'gb-au-ca-schedules-dry-run'
        run: npm run -s ingest:gb-au-ca-schedules -- --dry-run
      - name: GB/AU/CA release schedules (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'gb-au-ca-schedules'
        run: npm run -s ingest:gb-au-ca-schedules
      - name: GB/AU/CA official values dry run, no DB writes (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'official-values-dry-run'
        run: npm run -s ingest:official-values -- --dry-run
      - name: GB/AU/CA official values (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'official-values'
        run: npm run -s ingest:official-values
      - name: JP CPI schedule dry run, no DB writes (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'jp-cpi-schedule-dry-run'
        run: npm run -s ingest:jp-cpi-schedule -- --dry-run
      - name: JP CPI schedule (e-Stat release calendar table, manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'jp-cpi-schedule'
        run: npm run -s ingest:jp-cpi-schedule
      - name: JP CPI values dry run, no DB writes (manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'jp-cpi-values-dry-run'
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: npm run -s ingest:official:jp-cpi-values -- --dry-run
      - name: JP CPI values (e-Stat API, manual only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'jp-cpi-values'
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: npm run -s ingest:official:jp-cpi-values
