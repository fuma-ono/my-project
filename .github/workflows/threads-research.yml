name: Threads Affiliate - Research

# 楽天APIで商品候補を調査する(threads-affiliate/research.py)。
# 毎週火曜 06:00 JST頃(投稿生成Routineより前)に実行する想定。
#
# 2026-09-09: threads-publish.ymlで「毎時00分」設定のスケジュールが
# 一度も発火しない事象が発生し、GitHub公式ドキュメントの「毎時00分は
# Actions全体の混雑ピークで遅延・スキップされやすい」という既知の制限が
# 原因と判明した。このワークフローも同じく毎時00分だったため、
# 同時に`5`分にずらした。
on:
  schedule:
    - cron: '5 21 * * 1' # 火曜 06:05 JST = 月曜 21:05 UTC(毎時00分の混雑を回避)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/note-issue-1pjubh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run research.py
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python3 threads-affiliate/research.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- threads-affiliate/product-candidates.md threads-affiliate/products.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "商品候補を自動更新(GitHub Actions)"
            git fetch origin claude/note-issue-1pjubh
            git rebase origin/claude/note-issue-1pjubh
            git push origin HEAD:claude/note-issue-1pjubh
          fi
