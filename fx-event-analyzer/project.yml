name: FXEventAnalyzer
options:
  bundleIdPrefix: com.fumaono
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Empty by default. CI overrides these on the xcodebuild command line
    # (SUPABASE_URL="..." as a trailing build-setting override — see
    # .github/workflows/fx-event-analyzer-ios-build.yml), which takes
    # precedence over this default. Blank values must never crash the app;
    # see FXEventAnalyzer/Auth/SupabaseConfig.swift.
    SUPABASE_URL: ""
    SUPABASE_ANON_KEY: ""
    # Phase 2: the Node.js Backend's own base URL (e.g.
    # https://api.example.com/api/v1), separate from SUPABASE_URL (the
    # Supabase project iOS's Auth SDK talks to directly — see
    # Networking/APIClient.swift's defaultBaseURLProvider). Blank by
    # default; no Backend has been deployed anywhere yet (Phase 2 report).
    API_BASE_URL: ""
    # Google Cloud Console OAuth Client ID (iOS type, tied to
    # com.fumaono.fxeventanalyzer) for native Google Sign-In
    # (GoogleSignInCoordinator). GIDSignIn reads this from the
    # GIDClientID Info.plist key below at first use — no code-side
    # configure() call needed. Blank-safe: GoogleSignInCoordinator checks
    # for an empty value itself before calling the SDK (HQ承認、2026-10-20)。
    GOOGLE_SIGNIN_CLIENT_ID: ""
    # The same Client ID's "reversed" form (Google Cloud Console shows it
    # next to the Client ID) — registered as a custom URL scheme below so
    # the system can hand control back to GIDSignIn after the browser-
    # based consent screen.
    GOOGLE_SIGNIN_REVERSED_CLIENT_ID: ""

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.2
  # Native Google Sign-In (GoogleSignInCoordinator). 10.0.0 is the latest
  # released version as of 2026-10-20; raises the minimum deployment
  # target to iOS 15.0, well under this project's 17.0.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0

targets:
  FXEventAnalyzer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FXEventAnalyzer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fumaono.fxeventanalyzer
        PRODUCT_NAME: FXEventAnalyzer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      configs:
        # Required for `@testable import FXEventAnalyzer` in FXEventAnalyzerTests.
        Debug:
          SWIFT_ENABLE_TESTABILITY: YES
        # TestFlight配布用の手動署名設定(HQ承認、2026-10-19)。このターゲット
        # だけに適用されるよう、ここ(プロジェクト設定)に書く。以前は
        # xcodebuildのコマンドライン上書き(xcargs)で渡していたが、その方式
        # だとSwift Packageの疑似ターゲット(swift-crypto_Crypto等)にも
        # プロビジョニングプロファイルの指定が一律で及んでしまい、
        # 「does not support provisioning profiles」でアーカイブが失敗した。
        # ここでターゲット単位に閉じることで、パッケージ側には影響しない。
        # DEVELOPMENT_TEAM・PROVISIONING_PROFILE_SPECIFIERの実値は
        # project.ymlに書かず、CI側がxcodebuildのコマンドラインから
        # $(FX_SIGNING_TEAM_ID)・$(FX_SIGNING_PROFILE_NAME)という別名の
        # 変数経由で渡す(Secrets管理の方針を維持)。
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: "$(FX_SIGNING_TEAM_ID)"
          PROVISIONING_PROFILE_SPECIFIER: "$(FX_SIGNING_PROFILE_NAME)"
    # HQ指示(2026-10-20)「サインインは両方実装しよう」: Sign In with Apple用の
    # Entitlement。`properties`指定によりXcodeGenがこのパスへファイルを
    # 生成する(project.pbxproj/Info.plistと同じ、コミット不要の生成物 —
    # .gitignore参照)。Apple Developer Portal側でApp IDに
    # "Sign In with Apple" Capabilityを有効化し、配布用プロビジョニング
    # プロファイルをそれを含む内容で再生成する必要がある(HQ別途対応)。
    entitlements:
      path: FXEventAnalyzer/Resources/FXEventAnalyzer.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: FXEventAnalyzer/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        # XcodeGen's generated Info.plist otherwise hard-codes "1.0" / "1";
        # read the build settings so SCR-023 アプリ情報 shows the real version.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # HQ指示(2026-10-20)「アプリ全体を縦画面固定にする」→HQ判断
        # (2026-10-21「TestFlightアップロード失敗の修正」、選択肢B)で
        # iPad側のみ差し戻し: iPadを横画面禁止にすると、App Store Connect
        # へのアップロード自体がバリデーションエラーで拒否される
        # (「iPadのマルチタスクをサポートするには4方向すべてを
        # UISupportedInterfaceOrientationsに含める必要がある」、実際に
        # TestFlightワークフローのupload_to_testflightステップで409
        # エラーとして確認済み、2026-10-20)。そのため:
        #   - iPad: Portrait・PortraitUpsideDown・LandscapeLeft・
        #     LandscapeRightの4方向を許可(変更前の設定に戻す)。
        #
        # HQ指示(2026-10-25)「過去イベント比較の表が縦画面に入らないので、
        # この画面だけ横画面できるようにしたい」でiPhoneもLandscapeLeft/
        # Rightを追加した。このキーは「アプリとして使ってよい向きの上限」
        # であり、実際にどの画面で横画面を許すかは`OrientationAppDelegate`/
        # `OrientationLock`(`FXEventAnalyzer/App/OrientationLock.swift`)が
        # 画面単位で動的に絞り込む — このキーとアプリ側のmaskの掛け算(AND)
        # で最終的な許可範囲が決まるため、両方の変更が必要だった。既定では
        # `OrientationLock.mask`はPortraitのみなので、このキーを広げても
        # 過去イベント比較画面以外は従来通りPortrait固定のまま回転しない。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Read at runtime via SupabaseConfig. Values come from the SUPABASE_URL /
        # SUPABASE_ANON_KEY build settings (see settings.base above), which CI
        # populates from GitHub Actions secrets and which are blank by default.
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        # Read at runtime via URLSessionAPIClient.defaultBaseURLProvider.
        API_BASE_URL: "$(API_BASE_URL)"
        # GIDSignIn reads this key itself at first use (GoogleSignInCoordinator
        # doc comment) — no code-side configure() call needed.
        GIDClientID: "$(GOOGLE_SIGNIN_CLIENT_ID)"
        # Lets the system route back to GIDSignIn after the Google consent
        # screen (`FXEventAnalyzerApp`'s `.onOpenURL` hands the URL to
        # `GIDSignIn.sharedInstance.handle(_:)`). Blank-safe: an empty
        # CFBundleURLSchemes entry is simply never matched.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "$(GOOGLE_SIGNIN_REVERSED_CLIENT_ID)"
        # HQ指示(2026-10-01、「日本語のみNoto Sans JPへ変更」): 日本語テキスト
        # 専用フォント。Resources/Fonts/配下はsourcesパス内のためXcodeGenが
        # 自動でTarget Membershipを付与するが、iOSでカスタムフォントを実際に
        # 読み込むにはUIAppFontsへのファイル名登録が別途必須。
        UIAppFonts:
          - NotoSansJP-SemiBold.ttf
        # HQ指示(2026-10-06)「バックグラウンド更新を入れて」: アプリを開かない
        # 間も、通知の予約を定期的に取り直す(NotificationBackgroundRefresh)。
        # BGTaskSchedulerは、ここに無い識別子を登録すると起動時に落ちる。
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.fumaono.fxeventanalyzer.notification-refresh
    dependencies:
      - package: Supabase
        product: Auth
      - package: GoogleSignIn
        product: GoogleSignIn

  FXEventAnalyzerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FXEventAnalyzerTests
    dependencies:
      - target: FXEventAnalyzer

  # HQ instruction "FX Event Analyzer UIスクリーンショット取得"
  # (2026-09-18): drives the real, unmodified app against
  # fx-event-analyzer-backend/scripts/ui-screenshot-mock-server.mjs and
  # captures XCTAttachment screenshots for HQ to review in CI Artifacts.
  # Deliberately its own target/scheme (below), not added to
  # FXEventAnalyzerTests or the FXEventAnalyzer scheme's test action, so
  # the existing fx-event-analyzer-ios-build.yml workflow — which has no
  # mock backend running — is untouched and cannot be slowed or broken by
  # it (HQ: "既存のmacOS CIを壊さないこと").
  FXEventAnalyzerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FXEventAnalyzerUITests
    dependencies:
      - target: FXEventAnalyzer

schemes:
  FXEventAnalyzer:
    build:
      targets:
        FXEventAnalyzer: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FXEventAnalyzerTests
    archive:
      config: Release

  # Separate scheme (see FXEventAnalyzerUITests above) — only
  # .github/workflows/fx-event-analyzer-ui-screenshots.yml invokes this.
  FXEventAnalyzerUIScreenshots:
    build:
      targets:
        FXEventAnalyzer: all
    test:
      config: Debug
      targets:
        - FXEventAnalyzerUITests
