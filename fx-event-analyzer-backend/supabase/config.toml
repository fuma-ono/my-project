# Supabase CLI project config for local development / CI validation.
#
# No real Supabase project has been provisioned yet (Phase 0/2 audit) — this
# file only drives `supabase start` for local dev and the CI migration
# validation job (.github/workflows/fx-event-analyzer-backend-db.yml). It is
# not linked to any live project, and contains no secrets by design (secrets
# are never stored here regardless of project state).
project_id = "fx-event-analyzer"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# HQ指示(2026-11-06「政策金利テーブルの権限問題」): ローカル・CI の DB を DEV(PostgreSQL 17.11)と同じ 17 系にする
# (以前は 15。migration の定義の表し方などを DEV と同じ版で確かめるため)。
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
