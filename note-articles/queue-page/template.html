<title>note投稿キュー</title>
<style>
  @font-face { font-family: "Gloock"; src: url(data:font/ttf;base64,__GLOOCK__) format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Work Sans"; src: url(data:font/ttf;base64,__WORKSANS_REG__) format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Work Sans"; src: url(data:font/ttf;base64,__WORKSANS_BOLD__) format("truetype"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url(data:font/ttf;base64,__PLEXMONO_REG__) format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url(data:font/ttf;base64,__PLEXMONO_BOLD__) format("truetype"); font-weight: 700; font-display: swap; }

  :root {
    --bg: #eef0f6; --surface: #ffffff; --surface-2: #f6f7fb; --border: #d9dcec;
    --text: #171a2b; --text-dim: #5b6082; --text-faint: #8489a8;
    --accent: #d9682f; --accent-soft: #f3ded0;
    --good: #2f9e63; --good-soft: #dcf1e5;
    --shadow: 0 1px 2px rgba(23,26,43,0.06), 0 8px 24px rgba(23,26,43,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e1a; --surface: #141a30; --surface-2: #1b2340; --border: #2a3157;
      --text: #eef0fa; --text-dim: #9aa0c3; --text-faint: #6e739a;
      --accent: #f0955c; --accent-soft: #3a2a20;
      --good: #57cf8f; --good-soft: #17301f;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="light"] {
    --bg: #eef0f6; --surface: #ffffff; --surface-2: #f6f7fb; --border: #d9dcec;
    --text: #171a2b; --text-dim: #5b6082; --text-faint: #8489a8;
    --accent: #d9682f; --accent-soft: #f3ded0;
    --good: #2f9e63; --good-soft: #dcf1e5;
    --shadow: 0 1px 2px rgba(23,26,43,0.06), 0 8px 24px rgba(23,26,43,0.05);
  }
  :root[data-theme="dark"] {
    --bg: #0b0e1a; --surface: #141a30; --surface-2: #1b2340; --border: #2a3157;
    --text: #eef0fa; --text-dim: #9aa0c3; --text-faint: #6e739a;
    --accent: #f0955c; --accent-soft: #3a2a20;
    --good: #57cf8f; --good-soft: #17301f;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Work Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding: 0 0 72px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 0; }

  header.top { border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 28px; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 8px; }
  h1.brand { font-family: "Gloock", serif; font-weight: 400; font-size: clamp(26px, 4vw, 34px); margin: 0 0 10px; text-wrap: balance; }
  .lede { font-size: 14.5px; color: var(--text-dim); line-height: 1.8; max-width: 560px; }
  .lede b { color: var(--text); }

  .article {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); padding: 26px 26px 24px; margin-bottom: 26px;
  }
  .article-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
  .order-badge {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent); font-family: "IBM Plex Mono", monospace;
    font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  .article-meta { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-faint); margin-top: 3px; }
  .article-title-label { font-weight: 700; font-size: 16px; margin-top: 2px; }

  .copy-label { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 4px; }
  .copybox {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
    color: var(--text); white-space: pre-wrap; word-break: break-word; position: relative; cursor: pointer;
    line-height: 1.7;
  }
  .copybox.title-box { font-family: "Work Sans", sans-serif; font-size: 15px; font-weight: 700; }
  .copybox .copy-hint { position: absolute; top: 10px; right: 12px; font-size: 10px; color: var(--text-faint); font-family: "Work Sans", sans-serif; }
  .copybox.copied { border-color: var(--good); }

  .mark-done {
    margin-top: 16px; display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--text-dim); cursor: pointer; user-select: none;
  }
  .mark-done input { accent-color: var(--good); width: 15px; height: 15px; }

  .cadence-note {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); padding: 16px 20px; margin-bottom: 32px; font-size: 13px; color: var(--text-dim); line-height: 1.7;
  }
  .cadence-note b { color: var(--text); font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 8px; }

  footer { max-width: 720px; margin: 0 auto; padding: 0 24px; font-size: 11.5px; color: var(--text-faint); font-family: "IBM Plex Mono", monospace; }
</style>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">note 投稿キュー · 7本公開済み(非表示)・待ちなし</p>
    <h1 class="brand">note投稿キュー</h1>
    <p class="lede">01〜07はすべて投稿済みのため、このページから削除済みです。次の下書きができ次第、ここに追加されます。投稿したらチェックを入れると、そのカードがこのページから消えます(ブラウザに保存されるので、再読み込みしても消えたままです)。</p>
  </header>

  <div class="cadence-note">
    <b>05・06・07投稿完了。</b>公開済み7本の詳細は <code>note-articles/README.md</code> の進捗チェックリストを参照してください。次の下書きが追加され次第、このページにも追記します。
  </div>
</div>

<footer>社長発 · note投稿キュー · 新しい下書きができ次第このページに追加</footer>

<script>
  document.querySelectorAll(".copybox").forEach(function (box) {
    box.addEventListener("click", function () {
      var bodyEl = box.querySelector(".body-text");
      var text = bodyEl ? bodyEl.textContent : box.getAttribute("data-copy");
      var done = function () {
        box.classList.add("copied");
        var hint = box.querySelector(".copy-hint");
        if (hint) { var prev = hint.textContent; hint.textContent = "コピーしました"; setTimeout(function () { hint.textContent = prev; box.classList.remove("copied"); }, 1400); }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {});
      }
    });
  });
  var STORAGE_KEY = "note-queue-posted-v1";
  function loadPosted() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch (e) { return []; }
  }
  function savePosted(ids) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(ids)); } catch (e) {}
  }
  function removeCard(id) {
    var target = document.getElementById(id);
    if (target) target.remove();
  }

  var posted = loadPosted();
  posted.forEach(removeCard);

  document.querySelectorAll(".mark-done input").forEach(function (cb) {
    cb.addEventListener("change", function () {
      if (!cb.checked) return;
      var id = cb.getAttribute("data-target");
      var ids = loadPosted();
      if (ids.indexOf(id) === -1) { ids.push(id); savePosted(ids); }
      removeCard(id);
    });
  });
</script>
